/* Conversation list and thread scroll independently. */
.shell.messenger-screen {
  height: 100dvh; min-height: 0; padding-bottom: 24px;
  display: flex; flex-direction: column;
}
.messenger-workspace {
  display: grid; grid-template-columns: minmax(280px, 31%) minmax(0, 1fr);
  flex: 1; min-height: 0; border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden;
}
.conversation-sidebar {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border-inline-end: 1px solid var(--line);
}
.conversation-sidebar-head {
  padding: 18px 14px 12px; border-bottom: 1px solid var(--line);
}
.conversation-sidebar-head :is(h1, h2) {
  margin: 0 0 12px; font-size: 21px; line-height: 1.22;
}
.conversation-sidebar-head h1:focus { outline: none; }
.conversation-search { position: relative; display: block; }
.conversation-search > svg {
  position: absolute; inset-inline-start: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px; color: var(--dim); pointer-events: none;
}
.conversation-search input {
  display: block; width: 100%; min-width: 0; min-height: 44px;
  padding: 8px 34px 8px 35px; border: 1px solid var(--line);
  border-radius: 7px; background: var(--bg); color: var(--text);
}
.conversation-search input::placeholder { color: var(--dim); }
.conversation-sidebar .tabs { margin: 10px 0 0; gap: 5px; }
.conversation-sidebar .chip { padding-inline: 8px; }
.conversation-list {
  flex: 1; min-height: 0; overflow: auto; overscroll-behavior: contain; scrollbar-width: thin;
  list-style: none; margin: 0; padding: 6px 7px;
}
.conversation-item + .conversation-item { margin-top: 2px; }
.conversation-row {
  position: relative; display: grid; grid-template-columns: auto minmax(0,1fr);
  align-items: center; gap: 10px; width: 100%; min-height: 68px;
  padding: 9px; text-align: start; border: 1px solid transparent; border-radius: 7px;
  background: transparent; color: var(--text);
}
.conversation-row[aria-current=true] {
  background: var(--surface-hover);
}
.conversation-row[aria-current=true]::before {
  content: ""; position: absolute; inset: 9px auto 9px 0; width: 2px;
  border-radius: 2px; background: var(--purple);
}
.conversation-row:focus-visible { outline: 1px solid var(--line-strong); outline-offset: -1px; }
.conversation-row[aria-current=true]:focus-visible { outline: none; }
.conversation-row[aria-current=true]:focus-visible::before { width: 3px; background: var(--focus); }
.conversation-avatar {
  display: grid; place-items: center; flex: none; width: 38px; height: 38px;
  border-radius: 8px; background: var(--surface-accent); color: var(--purple);
  font-size: 12px; font-weight: 650; letter-spacing: .025em;
}
.conversation-avatar.is-lobby { background: var(--card); }
.conversation-avatar.is-lobby svg { width: 18px; height: 18px; }
.conversation-row > .avatar { width: 38px; height: 38px; }
.conversation-copy, .conversation-copy-head { min-width: 0; display: block; }
.conversation-copy-head { display: flex; align-items: baseline; gap: 6px; justify-content: space-between; }
.conversation-name, .conversation-preview {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.conversation-name { font-size: 14px; font-weight: 650; }
.conversation-copy time {
  color: var(--dim); white-space: nowrap; font-size: 11px; font-variant-numeric: tabular-nums; flex: none;
}
.conversation-preview { display: block; margin-top: 3px; color: var(--dim); font-size: 12px; }
.conversation-preview.is-live { color: var(--green); }
.conversation-empty { padding: 17px 9px; color: var(--dim); font-size: 13px; }
.messenger-thread, .messenger-thread > .chat { min-width: 0; min-height: 0; }
.messenger-thread { display: flex; flex-direction: column; }
.messenger-thread > .chat {
  display: flex; flex-direction: column; flex: 1; width: 100%; max-width: none; margin: 0;
  padding-inline: clamp(14px, 2vw, 26px);
}
.thread-header {
  flex: none; display: flex; align-items: center; gap: 10px; min-height: 72px;
  padding-block: 8px; border-bottom: 1px solid var(--line); margin: 0;
}
.thread-identity { flex: 1; min-width: 0; }
.thread-identity h1 {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 21px; line-height: 1.25;
}
.thread-identity small { display: block; margin-top: 3px; }
.thread-header .thread-back { display: none; width: 44px; height: 44px; }
.thread-header .callbar { flex: none; }
.messenger-thread .chatlog {
  flex: 1; min-height: 0; max-height: none; overflow-y: auto; padding: 18px 0;
}
.messenger-thread .chatlog > :first-child { margin-block-start: auto; }
.messenger-thread .composer {
  flex: none; padding: 12px 0; border-top: 1px solid var(--line);
}
.messenger-thread .composer textarea { margin: 0; }
.thread-placeholder {
  display: grid; justify-items: center; align-content: center; gap: 8px;
  flex: 1; padding: 20px; text-align: center; color: var(--dim);
}
.thread-placeholder > svg { width: 28px; height: 28px; color: var(--purple); }
.thread-placeholder :is(h1, h2) { color: var(--text); font-size: 17px; }
.thread-unavailable { padding: 0 18px; }
@media (hover: hover) {
  .conversation-row:hover { background: var(--card); }
  .conversation-row[aria-current=true]:hover { background: var(--surface-hover); }
}
@media (max-width: 899px) {
  .shell.messenger-screen { padding-bottom: calc(90px + env(safe-area-inset-bottom)); }
  .messenger-workspace {
    grid-template-columns: minmax(0, 1fr); border: 0; border-radius: 0;
  }
  .messenger-workspace.has-thread > .conversation-sidebar,
  .messenger-workspace:not(.has-thread) > .messenger-thread { display: none; }
  .conversation-sidebar { background: transparent; border: 0; }
  .conversation-sidebar-head { padding: 0 0 12px; }
  .conversation-sidebar-head h1 { font-size: 25px; }
  .conversation-search input { font-size: 16px; }
  .conversation-list { padding-inline: 0; }
  .conversation-row { padding-inline: 9px; }
  .messenger-thread > .chat { padding-inline: 0; }
  .thread-header { min-height: 58px; padding-top: 0; }
  .thread-header .thread-back { display: grid; }
  .thread-unavailable { padding-inline: 0; }
  .messenger-thread .composer { padding-bottom: 0; }
  .messenger-thread .composer textarea { font-size: 16px; }
}
@media (max-width: 540px) {
  .thread-header { gap: 7px; }
  .thread-header .callbar {
    justify-content: center; width: 44px; padding-inline: 0;
  }
  .thread-header .callbar > span { display: none; }
  .thread-header > :is(.avatar, .conversation-avatar) { display: none; }
  .thread-identity h1 { font-size: 17px; }
}
@media (max-height: 500px) {
  .thread-header { min-height: 50px; }
}

/* Chat and video call */
.chat .callbar {
  width: fit-content; min-height: 44px; gap: 7px; padding-inline: 12px;
  border: 1px solid var(--line); border-radius: 7px;
  color: var(--purple); background: var(--panel); font-weight: 650;
}
.chat .callbar[data-action="return-call"] { background: var(--surface-hover, #292238); }
.chat .callbar svg { width: 17px; height: 17px; }
.chat .composer button { border-radius: 7px; color: var(--accent-ink, #180D2A); }
.chat .composer button svg { width: 19px; height: 19px; }
.bubble { padding: 9px 12px; border-radius: 3px 9px 9px 9px; font-size: 14px; }
.bubble.mine { border-radius: 9px 3px 9px 9px; background: var(--surface-hover, #292238); }
.bubble small { margin-bottom: 3px; font-size: 11px; font-weight: 650; }
.bubble small time { margin-inline-start: 7px; color: var(--dim); font-weight: 400; font-variant-numeric: tabular-nums; }
.call-event {
  display: flex; align-items: center; align-self: center; gap: 10px;
  max-width: 100%; padding: 10px 12px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--panel); text-align: left;
}
.call-event > span { min-width: 0; }
.call-event svg { width: 17px; height: 17px; color: var(--dim); }
.call-event strong { display: block; font-size: 13px; font-weight: 650; }
.call-event small { display: flex; flex-wrap: wrap; gap: 2px 9px; font-size: 11px; font-variant-numeric: tabular-nums; }
.call-event[data-action="return-call"] { border-color: color-mix(in srgb, var(--purple) 42%, var(--line)); }
.call-event[data-action="return-call"] svg { color: var(--purple); }
.call-event-arrow { display: flex; flex: none; }
.call-event-link { display: block; margin-top: 3px; color: var(--purple); font-size: 12px; font-weight: 650; }
.video-call { max-width: 760px; margin: auto; }
.video-stage {
  padding: 14px; border: 1px solid var(--line); border-radius: 11px;
  background: var(--panel);
}
.video-stage-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 12px;
}
.video-stage-head h2 { overflow-wrap: anywhere; font-size: 15px; }
.video-time {
  flex: none; color: var(--green); font-size: 13px; font-weight: 650; font-variant-numeric: tabular-nums;
}
.video-tiles {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px;
  max-height: min(62vh, 510px); overflow: auto; scrollbar-width: thin;
}
.video-tile {
  display: grid; place-items: center; position: relative; overflow: hidden;
  width: 100%; min-width: 0; min-height: 140px; aspect-ratio: 2 / 1; border: 1px solid var(--line);
  border-radius: 7px; background: var(--card);
}
.video-tile.is-local {
  border-color: color-mix(in srgb, var(--purple) 57%, var(--line));
  background: color-mix(in srgb, var(--purple) 6%, var(--card));
}
.video-tile:has(video:not([hidden])) { border-color: var(--purple); }
.video-tile .avatar {
  width: 44px; height: 44px; margin-bottom: 9px; border-radius: 8px;
  background: var(--surface-hover, #292238); color: var(--dim); font-size: 15px; font-weight: 650;
  font-family: var(--font-display, inherit);
}
.video-tile.is-local .avatar { color: var(--purple); }
.video-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.video-participant {
  position: absolute; inset: auto 8px 8px; display: flex; justify-content: space-between;
  align-items: center; gap: 5px; font-size: 12px;
}
.video-participant span, .video-participant .video-mic {
  display: inline-flex; align-items: center; gap: 5px; min-width: 0;
}
.video-participant span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.video-participant small { margin-inline-start: 3px; font-size: 11px; }
.video-participant .video-mic { flex: none; color: var(--dim); }
.video-participant .video-mic.is-on { color: var(--green); }
.video-participant svg { width: 15px; height: 15px; }
video:not([hidden]) + .video-participant :is(span, .video-mic) {
  padding: 3px 5px; border-radius: 4px; background: var(--bg);
}
.video-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.video-controls button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 8px 11px; border: 1px solid var(--line);
  border-radius: 8px; background: var(--card); font-size: 13px; font-weight: 650; line-height: 1.3;
}
.video-controls button svg { width: 17px; height: 17px; }
.video-controls button[aria-pressed=true] {
  color: var(--purple); background: var(--surface-hover, #292238); border-color: var(--purple);
}
.video-controls button[data-action=end-call] {
  color: var(--danger-text, #F293A6);
  background: color-mix(in srgb, var(--danger-text, #F293A6) 11%, var(--card));
  border-color: color-mix(in srgb, var(--danger-text, #F293A6) 37%, var(--line));
}
.floating-call {
  position: fixed; inset: 0 auto auto 0; z-index: 25;
  width: 216px; padding: 5px; border: 1px solid var(--line-strong); border-radius: 10px;
  background: var(--panel); box-shadow: 0 6px 24px rgba(0,0,0,.42);
}
.floating-call[hidden], .floating-call [hidden] { display: none; }
.floating-call-grip {
  display: flex; align-items: center; gap: 7px; width: 100%; min-height: 39px;
  padding: 6px; border-radius: 5px; background: transparent;
  color: var(--text); text-align: start; cursor: grab; touch-action: none; user-select: none;
}
.floating-call[data-dragging] .floating-call-grip { cursor: grabbing; }
.floating-call-grip svg { flex: none; width: 16px; height: 16px; color: var(--dim); }
.floating-call-name {
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-size: 12px; font-weight: 650;
}
.floating-call-grip time {
  flex: none; color: var(--green); font-size: 11px; font-variant-numeric: tabular-nums;
}
.floating-call-preview {
  position: relative; display: grid; place-items: center; min-height: 82px; overflow: hidden;
  border-radius: 6px; background: var(--card);
}
.floating-call-camera-off {
  display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; padding: 6px;
}
.floating-call-camera-off .avatar { width: 28px; height: 28px; background: var(--surface-hover); color: var(--purple); }
.floating-call-preview video {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
}
.floating-call-actions { display: flex; gap: 5px; padding-top: 5px; }
.floating-call-actions button {
  display: flex; align-items: center; justify-content: center; gap: 5px;
  min-height: 38px; padding: 4px 6px; border-radius: 5px; background: var(--card);
  color: var(--purple); font-size: 12px;
}
.floating-call-actions [data-action="return-call"] { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.floating-call-actions [data-action="end-call"] { min-width: 40px; color: var(--danger-text); }
.floating-call-actions svg { flex: none; width: 15px; height: 15px; }
.floating-call.is-compact:not([hidden]) { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
.floating-call.is-compact .floating-call-grip { padding-inline: 4px; }
.floating-call.is-compact :is(.floating-call-preview, .floating-call-name, .floating-call-actions button span) { display: none; }
.floating-call.is-compact .floating-call-actions { padding-top: 0; gap: 3px; }
.floating-call.is-compact .floating-call-actions button { min-width: 36px; }
@media (hover: hover) {
  .floating-call button:hover { background: var(--surface-hover); }
}
@media (max-width: 899px) {
  .floating-call { width: 176px; }
  .floating-call-grip, .floating-call-actions button { min-height: 44px; }
  .floating-call-actions [data-action="end-call"] { min-width: 44px; }
  .floating-call-preview { min-height: 69px; }
  .floating-call.is-compact .floating-call-actions button { min-width: 44px; }
}
@media (hover: hover) {
  .chat .callbar:hover, .call-event[data-action="return-call"]:hover {
    border-color: var(--purple); background: var(--surface-hover, #292238);
  }
  .video-controls button:hover:not(:disabled) { border-color: var(--purple); background: var(--surface-hover, #292238); }
  .video-controls button[data-action=end-call]:hover {
    border-color: var(--danger-text, #F293A6);
    background: color-mix(in srgb, var(--danger-text, #F293A6) 19%, var(--card));
  }
}
@media (hover: hover) and (prefers-reduced-motion: no-preference) {
  .call-event-arrow { transition: transform 145ms cubic-bezier(.2, .75, .25, 1); }
  .call-event[data-action="return-call"]:hover .call-event-arrow { transform: translateX(2px); }
}
@media (max-width: 540px) {
  .video-stage { padding: 11px; }
  .video-tile { min-height: 106px; }
  .video-tile .avatar { width: 36px; height: 36px; font-size: 13px; }
  .video-participant { bottom: 5px; inset-inline: 5px; gap: 3px; }
  .video-participant span, .video-participant .video-mic { font-size: 11px; }
  .video-participant small { font-size: 10px; }
  .video-controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .video-controls button { padding-inline: 6px; min-width: 0; font-size: 12px; }
}

/* Profile and settings */
.account-content { display: grid; gap: 18px; }
.profilehero > div, .player-profile .person > div { min-width: 0; }
.player-profile .person h2, .player-profile .section { overflow-wrap: anywhere; }
.account-content .profilehero { border: 1px solid var(--line); }
.account-section { display: grid; gap: 7px; }
.account-section h2 { margin: 0 0 2px; color: var(--dim); font-size: 13px; font-weight: 600; }
.account-menu { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; min-height: 50px; padding: 9px 12px; border: 1px solid var(--line); }
.account-menu .account-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 7px; background: var(--surface-accent); }
.account-menu .account-icon svg { width: 17px; height: 17px; color: var(--purple); }
.account-menu .account-label { overflow-wrap: anywhere; }
.account-menu .account-label small { display: block; margin-top: 2px; color: var(--dim); font-weight: 400; }
.account-exit { display: flex; align-items: center; justify-content: center; gap: 9px; }
.account-exit svg { width: 18px; height: 18px; }
.signed-out .nav { justify-content: flex-start; }
.signed-out .nav .brand { cursor: default; }
@media (max-width: 899px) { .signed-out .nav { display: none; } }
/* Team search, scheduling, and recruitment */
.search-controls{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search-controls .tabs{margin:0}
.filter-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;min-height:42px;border-radius:9px;background:var(--panel);border:1px solid var(--line);font-weight:bold}
.filter-toggle svg{width:18px;height:18px;color:var(--purple)}
.filter-count{display:grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:6px;background:var(--surface-accent);color:var(--purple);font-size:11px}
.search-results .team{display:flex;flex-direction:column}
.team .team-schedule{color:var(--dim);margin-top:4px;font-size:12px}
.team .cardfoot{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:8px;margin-top:auto}
.team .cardfoot button{padding-inline:8px}
.schedule-fields,.recruit-roles{border:0;padding:0;margin:0;min-width:0}
.schedule-fields>legend,.recruit-roles>legend{padding:0;margin-bottom:10px;font-weight:bold}
.schedule-fields{padding:16px;border:1px solid var(--line);border-radius:12px}
.schedule-fields>legend{padding:0 6px;margin:0 0 0 -6px}
.schedule-fields .field input{min-height:44px}
.field input[type=time]::-webkit-calendar-picker-indicator{cursor:pointer}

/* Calendar used by group scheduling and search filters. */
.date-picker .calendar-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:44px;padding:10px 12px;
  background:var(--card);border:1px solid var(--line);border-radius:8px;text-align:left;
}
.calendar-trigger[aria-expanded=true]{border-color:var(--purple)}
.calendar-trigger[aria-invalid=true]{border-color:var(--danger-text)}
.calendar-trigger svg{width:18px;height:18px;color:var(--purple)}
.calendar-value.is-empty{color:var(--dim)}
.calendar-popup{
  position:fixed;z-index:30;width:min(320px,calc(100% - 24px));padding:12px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 16px 44px #0009;overflow:auto;scrollbar-width:thin;overscroll-behavior:contain;
}
.calendar-popup[hidden]{display:none}
.calendar-header,.calendar-footer{display:flex;align-items:center;justify-content:space-between;gap:6px}
.calendar-header{margin-bottom:6px}
.calendar-month{font-size:14px;text-align:center}
.calendar-month-button{
  display:grid;place-items:center;width:36px;height:36px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--card);
}
.calendar-month-button svg{width:15px;height:15px}
.calendar-days{width:100%;table-layout:fixed;border-spacing:3px;font-variant-numeric:tabular-nums}
.calendar-days th{padding:5px 0;color:var(--dim);font-size:11px;font-weight:normal}
.calendar-days td{padding:0}
.calendar-day{width:100%;min-height:34px;padding:0;border-radius:7px;background:transparent}
.calendar-day:hover:not(:disabled),.calendar-text-button:hover:not(:disabled){background:var(--surface-accent)}
.calendar-day:disabled{opacity:.42}
.calendar-day[aria-current=date]{color:var(--purple);box-shadow:inset 0 0 0 1px var(--line-strong)}
.calendar-day[aria-pressed=true],.calendar-day[aria-pressed=true]:hover{
  background:var(--purple);color:var(--accent-ink);box-shadow:none;font-weight:bold;
}
.calendar-popup button:focus-visible{outline-offset:-2px}
.calendar-footer{margin-top:7px;padding-top:7px;border-top:1px solid var(--line)}
.calendar-text-button{min-height:34px;padding:5px 8px;border-radius:7px;background:transparent;color:var(--purple);font-size:12px}
.calendar-clear:disabled{opacity:.5}
.field-label{display:block;font-size:12px;color:var(--dim);margin-bottom:7px}
.schedule-period output,.lobby-format p{display:flex;align-items:center;min-height:44px;margin:0;padding:10px 12px;border-radius:8px;background:var(--panel);color:var(--dim)}
.schedule-repeat,.recruit-roles .chip{display:flex;align-items:center;gap:8px}
.schedule-repeat{width:fit-content;margin-top:16px}
.schedule-repeat input,.recruit-roles input{margin:0;accent-color:var(--purple)}
.schedule-fields .error:not([hidden]){margin-top:10px}
.application-workspace{width:100%;max-width:860px;margin-inline:auto;grid-template-columns:minmax(0,1fr)}
@media(max-width:540px){.schedule-fields{padding:12px}.search-controls .chip,.filter-toggle{min-height:40px}.team .cardfoot button{font-size:12px}}
/* Keep page titles, content and navigation on a shared grid. */
:root {
  --page-width: 1184px;
  --page-gutter: clamp(20px, 4vw, 36px);
  --content-width: 700px;
  --narrow-width: 500px;
}
.shell {
  width: 100%;
  max-width: var(--page-width);
  padding-inline: var(--page-gutter);
}
.content, .chat { width: 100%; max-width: var(--content-width); }
.narrow { width: 100%; max-width: var(--narrow-width); }
.shell:is([data-screen="team"], [data-screen="new"], [data-screen="requirements"], [data-screen="subscription"]) > .page-head {
  width: min(100%, var(--content-width));
  margin-inline: auto;
}
.shell:is([data-screen="filters"], [data-screen="player"], [data-screen="apply"], [data-screen="candidate"], [data-screen="profile"], [data-screen="settings"], [data-screen="edit"], [data-screen="preferences"], [data-screen="games"], [data-screen="timezone"], [data-screen="notifications"], [data-screen="privacy"]) > .page-head {
  width: min(100%, var(--narrow-width));
  margin-inline: auto;
}
.shell:is([data-screen="application"], [data-screen="create"], [data-screen="published"]) > .page-head {
  width: min(100%, 440px);
  margin-inline: auto;
}
.shell[data-screen="call"] > .page-head {
  width: min(100%, 760px);
  margin-inline: auto;
}
.shell[data-screen="applications"] > .page-head {
  width: min(100%, 860px);
  margin-inline: auto;
}
.content > .subtitle { margin-top: 0; text-align: left; }
.page-head { min-height: 36px; }
.primary, .secondary, .danger {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.primary svg, .secondary svg, .danger svg { width: 18px; height: 18px; }
.dashboard-head { align-items: center; }
.dashboard-head .page-head { margin-bottom: 0; }
.dashboard-layout .toolbar { min-height: 44px; margin-bottom: 14px; }
.grid { align-items: stretch; }
.teamtop > div { min-width: 0; }
.member { min-height: 44px; }
.checkrow input { flex-shrink: 0; margin: 0; }

  else return;
  event.preventDefault();
  navigateCalendar(target,true);
});
function ensureGroupChat(g){let c=db.chats.find(c=>c.group===g.id);if(!c){c={id:newId('chat'),group:g.id,messages:[]};db.chats.push(c);persist()}return c}
function decide(id,status){let a=db.applications.find(a=>a.id===id),g=a&&group(a.group);if(!a||!g||g.owner!=='me'||a.status!=='pending')return toast('Эта заявка уже обработана.');if(status==='accepted'){if(lobbyEnded(g))return toast('Лобби уже завершилось.');if(!capacity(g))return toast('Состав уже собран. Нового игрока пока добавить нельзя.');if(!g.members.includes(a.player))g.members.push(a.player);if(capacity(g)>0&&g.roles.length>1)g.roles=g.roles.filter(role=>role!==a.role);if(!capacity(g))g.active=false;ensureGroupChat(g)}a.status=status;a.decided=Date.now();persist();go('incoming',g.id);toast(status==='accepted'?'Игрок принят в состав':'В этот раз не подошло')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let {action,screen,id,value,field:filterField,status}=b.dataset;
if(action==='sign-in')return changeSignIn(false);
if(db.signedOut)return;
if(action==='go'&&screen==='messages'&&b.classList.contains('nav-item')&&window.matchMedia('(min-width: 900px)').matches){
  const last=db.chats.find(chat=>chat.id===ui.lastChatId);
  if(hasChatAccess(last)){
    if(route.screen!=='chat'||route.id!==last.id)go('chat',last.id);
    return;
  }
}
if(action==='application-filter'&&(ui.applicationFilter||'all')!==value){ui.applicationFilter=value;return renderListChange(b)}
if(action==='back'){if(history.state?.withteam)history.back();else go(screen,id);return}if(action==='seats'){let input=document.getElementById('capacity');input.value=Math.min(Number(input.max),Math.max(Number(input.min),Math.trunc(Number(input.value))+Number(b.dataset.delta)));input.dispatchEvent(new Event('input',{bubbles:true}));return}if(action==='go'){if(b.matches('.nav-item,.brand,.conversation-row')&&screen===route.screen&&(id||'')===route.id)return;if(screen==='games')ui.profileGame=null;if(route.screen==='new'){let f=document.getElementById('new-form');if(f)captureNew(f)}
  if(screen==='player'){
    ui.playerGame=group(route.id)?.game;
    go(screen,id);
    if(ui.playerGame)history.replaceState({...history.state,playerGame:ui.playerGame},'');
    ui.playerGame=null;
  }else go(screen,id);
}
if(action==='search-tab'&&ui.searchType!==value){ui.searchType=value;renderListChange(b)}
if(action==='group-tab'){if(value==='applications')go('applications');else if(ui.groupType!==value){ui.groupType=value;renderListChange(b)}}
if(action==='message-tab'&&ui.messageType!==value){
  ui.messageType=value;
  for(const tab of app.querySelectorAll('[data-action="message-tab"]')){
    tab.setAttribute('aria-pressed',String(tab===b));
  }
  updateConversationList();
}
if(action==='filters'){ui.draftFilters={...ui.filters,type:ui.searchType==='team'?'Команда':'Лобби'};go('filters')}
if(action==='filter-choice'){
  let f=ui.draftFilters, selected=f[filterField];
  if(Array.isArray(selected)){
    let unrestricted=['Любая','Любой','Любое'].includes(value);
    f[filterField]=unrestricted?[]:selected.includes(value)?selected.filter(item=>item!==value):[...selected,value];
  }else{
    f[filterField]=value;
    if(filterField==='game'&&value!==selected){f.role=[];f.rank='Любой'}
  }
  let scroll=window.scrollY;
  render();
  window.scrollTo({top:scroll,behavior:'instant'});
  Array.from(app.querySelectorAll(`[data-field="${filterField}"]`))
    .find(option=>option.dataset.value===value)?.focus({preventScroll:true});
}
if(action==='reset-filters'){ui.filters=defaultFilters();renderListChange(b)}
if(action==='clear-filter-draft'){ui.draftFilters={...defaultFilters(),type:ui.searchType==='team'?'Команда':'Лобби'};renderListChange(b)}
if(action==='create-group')go(db.plus?'new':'create');
if(action==='activate-plus'){db.plus=true;persist();go('new');toast('WithTeam Plus подключён.')}
if(action==='withdraw'){let a=db.applications.find(a=>a.id===id&&a.player==='me');if(a?.status==='pending'){a.status='withdrawn';persist();render();toast('Заявка отозвана')}}
if(action==='open-group-chat'){let g=group(id);if(g?.members.includes('me'))go('chat',ensureGroupChat(g).id)}
if(action==='dm'){if(id==='me')return go('profile');if(!player(id))return;let c=db.chats.find(c=>c.peer===id);if(!c){c={id:newId('dm'),peer:id,messages:[]};db.chats.push(c);persist()}go('chat',c.id)}
if(action==='decide')decide(id,status);
if(action==='start-call')startCall(id);
if(action==='return-call'&&ui.call)go('call',ui.call.id);
if(action==='minimize-call'&&ui.call?.id===id){
  b.disabled=true;
  leaveCallScreen(id);
}
if(action==='toggle-call-media')toggleCallMedia(value);
if(action==='end-call')endCall();
if(action==='sign-out')changeSignIn(true);
});
document.addEventListener('input',e=>{
  if(e.target.id!=='conversation-search')return;
  ui.messageQuery=e.target.value;
  updateConversationList();
});
document.addEventListener('input',e=>{
  const form=e.target.closest('form');
  if(!form)return;
  if(form.id==='settings-form')form.setAttribute('data-dirty','');
  if(form.id==='message-form'&&e.target.name==='message'){
    if(e.target.value)messageDrafts.set(route.id,e.target.value);
    else messageDrafts.delete(route.id);
    resizeMessageField();
    form.querySelector('[type=submit]').disabled=!e.target.value.trim();
  }
  if(form.id==='apply-form')ui.applicationDraft[form.dataset.group]=Object.fromEntries(new FormData(form));
  if(form.id==='filters-form'&&e.target.name==='filter-date')ui.draftFilters.date=e.target.value;
  if(form.id==='new-form'){
    const d=captureNew(form);
    document.getElementById('schedule-period').textContent=d.startsAt?timePeriod(d.startsAt):'Укажите время начала';
    document.getElementById('schedule-error').hidden=true;
  }
  if(form.id==='recruit-form')captureRecruit(form);
});
document.addEventListener('change',e=>{let f=e.target.closest('form');if(!f)return;if(f.id==='new-form'){captureNew(f);if(['type','game'].includes(e.target.name)){render();document.getElementById(e.target.name)?.focus({preventScroll:true})}}if(f.id==='settings-form'&&route.screen==='games'&&e.target.name==='game'){ui.profileGame=e.target.value;let g=games[e.target.value],p=db.user.profiles.find(p=>p.game===e.target.value);f.elements.rank.innerHTML=g.ranks.map(v=>`<option ${v===p?.rank?'selected':''}>${esc(v)}</option>`).join('');f.elements.role.innerHTML=g.roles.map(v=>`<option ${v===p?.role?'selected':''}>${esc(v)}</option>`).join('')}});
document.addEventListener('submit',e=>{let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(db.signedOut)return;let data=new FormData(f),v=Object.fromEntries(data);
if(f.id==='filters-form'){let {type,...filters}=ui.draftFilters;filters.date=v['filter-date'];ui.filters=filters;ui.searchType=type==='Лобби'?'lobby':'team';go('search')}
if(f.id==='apply-form'){let g=group(f.dataset.group);if(!g||g.members.includes('me')||ownApplication(g)||!recruitmentOpen(g))return toast('Нельзя отправить заявку. Обновите страницу команды или лобби.');if(!(g.roles.length?g.roles:games[g.game].roles).includes(v.role))return toast('Выберите доступную роль.');let a={id:newId('application'),group:g.id,player:'me',role:v.role,text:v.text.trim(),status:'pending',created:Date.now()};db.applications.push(a);persist();delete ui.applicationDraft[g.id];go('application',a.id)}
if(f.id==='new-form'){
  const d=captureNew(f);
  if(!d.name.trim())return toast('Введите название.');
  if(!validGroupDraft(d)){
    const error=document.getElementById('schedule-error');
    const invalidDate=!validDate(d.startsOn)||d.startsOn<todayDate();
    const ended=lobbyEnded(d);
    error.textContent=invalidDate?'Выберите дату игры, начиная с сегодняшнего дня.':d.startsAt===d.endsAt?'Укажите разное время начала и окончания.':ended?'Это лобби уже завершилось. Выберите другое время или дату.':'Проверьте время игры.';
    error.hidden=false;
    if(invalidDate){
      const trigger=document.getElementById('startsOn-trigger');
      trigger.setAttribute('aria-invalid','true');
      trigger.focus();
    } else if(ended) f.elements.endsAt.focus();
    return;
  }
  go('requirements');
}
if(f.id==='recruit-form'){
  if(!db.plus)return go('subscription');
  const d=draft();
  if(!validGroupDraft(d)){
    go('new');
    if(lobbyEnded(d))toast('Лобби уже завершилось. Выберите другое время или дату.');
    return;
  }
  const game=games[d.game], roles=data.getAll('roles').filter(role=>game.roles.includes(role));
  const capacity=Number(v.capacity)+1, error=document.getElementById('recruit-error');
  if(!roles.length){error.textContent='Выберите хотя бы одну игровую роль.';return;}
  if(!Number.isInteger(capacity)||capacity<2||capacity>game.teamSize){error.textContent='Укажите от 1 до '+(game.teamSize-1)+' игроков.';return;}
  const g={id:newId('group'),...d,name:d.name.trim(),goal:d.goal.trim(),description:d.description.trim(),owner:'me',members:['me'],capacity,rank:v.rank,roles,active:true,recruitText:v.text.trim(),schedule:scheduleLabel(d),period:timePeriod(d.startsAt)};
  if(g.type==='lobby')g.scheduleTimeZone=db.user.timezone;
  db.groups.push(g);
  ensureGroupChat(g);
  ui.newDraft=null;
  ui.recruitDraft=null;
  go('published',g.id);
}
if(f.id==='message-form'){
  const text=v.message.trim(), chat=db.chats.find(c=>c.id===route.id);
  if(!text||!hasChatAccess(chat))return;
  chat.messages.push({author:'me',text,created:Date.now()});
  messageDrafts.delete(chat.id);
  persist();
  render({scrollChatToEnd:true});
  document.getElementById('message')?.focus({preventScroll:true});
}
if(f.id==='settings-form'){
  const screen=route.screen;
  if(screen==='edit'){
    const nick=v.nick.trim();
    if(!nick){
      f.elements.nick.value='';
      f.elements.nick.reportValidity();
      return;
    }
    db.user.nick=nick;
    db.user.about=v.about.trim();
  }
  if(screen==='preferences'){
    db.user.language=v.language;
    db.user.schedule=v.schedule.trim();
    db.user.goal=v.goal.trim();
  }
  if(screen==='games'){
    const profile={game:v.game,rank:v.rank,role:v.role};
    const index=db.user.profiles.findIndex(entry=>entry.game===v.game);
    if(index<0)db.user.profiles.push(profile);
    else db.user.profiles[index]=profile;
    ui.profileGame=v.game;
  }
  if(screen==='timezone')changeTimezone(v.timezone);
  if(screen==='notifications'){
    db.settings.applications=data.has('applications');
    db.settings.messages=data.has('messages');
  }
  if(screen==='privacy'){
    db.settings.visible=data.has('visible');
    db.settings.allowDM=data.has('allowDM');
  }
  if(persist())toast('Изменения сохранены');
  if(history.state?.withteam)history.back();
  else {
    replaceRoute(settingsParent(screen));
    readRoute();
  }
}
});
function updateTimer() {
  if (!ui.call) return;
  const elapsed = Math.max(0, Date.now() - ui.call.started);
  document.querySelectorAll('[data-call-timer]').forEach(timer => {
    timer.textContent = durationTime(elapsed);
    timer.dateTime = `PT${Math.floor(elapsed / 1000)}S`;
  });
}
window.addEventListener('hashchange',readRoute);
document.querySelector('.skip').addEventListener('click', event => {
  event.preventDefault();
  app.focus({preventScroll:true});
});
document.addEventListener('scroll', event => {
  if (event.target.id === 'chatlog') rememberChatScroll(event.target);
}, {capture:true, passive:true});
window.addEventListener('storage', event => {
  if (event.key !== STORAGE) return;
  try {
    const value = JSON.parse(event.newValue);
    if (value?.version === 2 && value.groups && value.user) {
      db = value;
      readRoute({preserveSettingsDraft:true});
    }
  } catch {}
});
ui.call = restoreCall();
setInterval(updateTimer,1000);
readRoute();
</script>
</body>
</html>

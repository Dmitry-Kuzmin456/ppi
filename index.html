/* Application filters occupy a separate row; both cards share a baseline. */
.application-workspace{row-gap:18px;column-gap:24px}
.application-workspace>section{display:contents}
.application-workspace>section>.tabs{grid-column:1/-1;margin:0}
.application-workspace>section>.list{grid-column:1;grid-row:2;min-width:0}
.application-workspace>.application-help{grid-column:2;grid-row:2}
.application-card,.application-help{padding:22px}
.application-card .teamtop{align-items:center}
.application-card .teamtop h3{margin:0 0 4px}
.application-card .teamtop small{display:block}
.application-card .meta{margin:22px 0}
.application-card .application-message{margin:0}
.application-card .squad-actions{margin-top:18px}
.application-footer .link{padding:8px 0}
.application-help ol{margin:20px 0;padding-left:20px}
.application-help li{padding-left:4px}
@media(max-width:760px){.application-workspace>section>.list{grid-column:1;grid-row:2}.application-workspace>.application-help{grid-column:1;grid-row:3}.application-card,.application-help{padding:16px}}

/* Chat uses the available viewport; only the message history scrolls. */
.shell.chat-screen{height:100dvh;min-height:0;display:flex;flex-direction:column;padding-bottom:24px;overflow:hidden}
.chat-screen>.page-head{flex-shrink:0}
.chat-screen>.chat{display:flex;flex-direction:column;flex:1;min-height:0;width:100%;margin-top:0;margin-bottom:0}
.chat-screen .callbar{flex-shrink:0}
.chat-screen .chatlog{flex:1;min-height:0;max-height:none;overflow-y:auto;padding:20px 0}
.chat-screen .composer{flex-shrink:0;padding-top:12px;border-top:1px solid var(--line)}
.chat-screen .composer textarea{margin:0}
@media(max-width:899px){.shell.chat-screen{padding-bottom:calc(90px + env(safe-area-inset-bottom))}.chat-screen .composer textarea{font-size:16px}}

/* Chat and video call */
.chat .callbar {
  width: fit-content; min-height: 42px; gap: 8px;
  border: 1px solid #54345e; font-weight: 700;
}
.chat .callbar svg { width: 19px; height: 19px; }
.chat .composer textarea { field-sizing: content; height: auto; min-height: 70px; }
.bubble small time { margin-left: 8px; color: var(--dim); font-weight: 400; }
.call-event {
  display: flex; align-items: center; align-self: center; gap: 12px;
  max-width: 100%; padding: 10px 15px; border: 1px solid var(--line);
  border-radius: 12px; background: var(--panel);
}
.call-event svg { color: var(--purple); }
.call-event small { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.video-call { max-width: 760px; margin: auto; }
.video-stage {
  padding: 18px; border: 1px solid var(--line); border-radius: 18px;
  background: var(--panel);
}
.video-stage-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 14px; padding: 0 2px;
}
.video-stage-head h2 { overflow-wrap: anywhere; }
.video-time, .call-indicator time { font-variant-numeric: tabular-nums; }
.video-time {
  display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0;
  padding: 5px 10px; border-radius: 7px; background: #19382c; color: var(--green);
  font-weight: 700;
}
.video-time::before, .call-indicator time::before {
  content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor;
}
.video-tiles {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;
  max-height: min(62vh, 510px); overflow: auto; scrollbar-width: thin;
}
.video-tile {
  display: grid; place-items: center; position: relative; overflow: hidden;
  width: 100%; min-width: 0; min-height: 140px; aspect-ratio: 2 / 1; border: 1px solid #3b354c;
  border-radius: 12px; background: radial-gradient(ellipse at 50% 40%, #332747, #1d1b2b 70%);
}
.video-tile.is-local { border-color: #855296; }
.video-tile .avatar {
  width: 56px; height: 56px; font-size: 18px; margin-bottom: 15px;
  border: 1px solid #ffffff22;
}
.video-tile video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.video-participant {
  position: absolute; inset: auto 8px 8px; display: flex; justify-content: space-between;
  align-items: center; gap: 5px;
}
.video-participant span, .video-participant .video-mic {
  display: inline-flex; align-items: center; gap: 6px; min-width: 0;
  padding: 4px 8px; border-radius: 6px; background: #0b0b10d9;
}
.video-participant span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.video-participant small { margin-left: 4px; }
.video-participant svg { width: 16px; height: 16px; }
.video-controls { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.video-controls button {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  min-height: 44px; padding: 8px 13px; border: 1px solid var(--line);
  border-radius: 9px; background: var(--card); color: #f4f3f7; font-size: 12px; font-weight: 700;
}
.video-controls button svg { width: 18px; height: 18px; }
.video-controls button[aria-pressed=true] { color: var(--green); border-color: #396455; }
.video-controls button[data-action=end-call] { background: #702f4d; border-color: #a34c70; }
.video-stage .hint { margin-top: 10px; text-align: center; }
.call-indicator {
  display: inline-flex; align-items: center; gap: 0; padding: 2px;
  background: #172d26; border: 1px solid #396455; border-radius: 10px; color: var(--green);
}
.call-indicator button { display: flex; align-items: center; gap: 7px; min-height: 35px; padding: 5px 9px; border-radius: 7px; background: transparent; white-space: nowrap; }

function input(name,value,extra=''){return `<input id="${name}" name="${name}" value="${esc(value)}" ${extra}>`}
function select(name,values,value){return `<select id="${name}" name="${name}">${values.map(v=>{let [id,t]=Array.isArray(v)?v:[v,v];return `<option value="${esc(id)}" ${id===value?'selected':''}>${esc(t)}</option>`}).join('')}</select>`}
function textarea(name,value,extra=''){return `<textarea id="${name}" name="${name}" ${extra}>${esc(value)}</textarea>`}
const submit=text=>`<button type="submit" class="primary">${text}</button>`;
const badge=s=>`<span class="badge ${s==='accepted'?'good':s==='rejected'?'bad':s==='withdrawn'?'neutral':''}">${({pending:'Ждёт решения',accepted:'Принята',rejected:'Отклонена',withdrawn:'Отозвана'})[s]||esc(s)}</span>`;
function avatar(id,i=0){let p=player(id);return `<span class="avatar tint-${i%4}" aria-hidden="true">${esc(initials(p?.nick||'?'))}</span>`}
function metadata(...items) {
  return `<span class="metadata">${items.filter(Boolean).map(item => `<span>${esc(item)}</span>`).join(' ')}</span>`;
}

function missing(text='Эта страница больше недоступна.'){return `<div class="center"><div class="symbol">${svg('search')}</div><h2>Ничего не найдено</h2><p>${text}</p><div class="actions">${button('Вернуться к поиску','go',{screen:'search'})}</div></div>`}
function teamCard(g){
  const mine=g.members.includes('me'), application=ownApplication(g);
  const action=mine?button('Открыть чат','open-group-chat',{id:g.id}):application?button('Моя заявка','go',{screen:'application',id:application.id}):button(g.type==='team'?'Вступить в команду':'Вступить в лобби','go',{screen:'apply',id:g.id});
  return `<article class="card team"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><h3>${esc(g.name)}</h3><span class="count" aria-label="Участники: ${g.members.length} из ${g.capacity}">${g.members.length} / ${g.capacity}</span></div><p class="muted">${esc(g.game)}</p><p class="team-schedule">${esc(scheduleText(g))}</p><div class="tags"><span class="tag">${esc(g.rank)}</span><span class="tag">${esc(g.language)}</span><span class="tag">${esc(g.roles.join(', ')||'Состав собран')}</span>${mine?'<span class="tag note">Вы в составе</span>':''}</div><div class="cardfoot">${button('Подробнее','go',{screen:'team',id:g.id,secondary:true})}${action}</div></article>`;
}
function summaryCard(g){
  const pending=db.applications.filter(a=>a.group===g.id&&a.status==='pending').length;
  return `<article class="card squad"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><div><h3>${esc(g.name)}</h3><small>${esc(g.game)}, ${g.owner==='me'?'организатор':'участник'}</small></div><span class="badge ${g.active?'good':'neutral'}">${g.active?'Набор открыт':'Состав собран'}</span></div><dl class="meta"><div><dt>Когда играем</dt><dd>${esc(scheduleText(g))}</dd></div><div><dt>Состав</dt><dd>${g.members.length} из ${g.capacity}, свободно ${capacity(g)}</dd></div></dl>${g.goal?`<p class="muted">${esc(g.goal)}</p>`:''}<div class="squad-actions">${button('Открыть чат','open-group-chat',{id:g.id,secondary:true})}${button('Посмотреть состав','go',{screen:'team',id:g.id,secondary:true})}</div>${g.owner==='me'?`<button class="review-applications" data-action="go" data-screen="incoming" data-id="${g.id}">${pending?'Ждут решения: '+pending:'Входящие заявки'} <span>Разобрать заявки →</span></button>`:''}</article>`;
}

function searchResults(){
  const f=ui.filters;
  return db.groups.filter(g=>g.active&&capacity(g)>0&&g.type===ui.searchType&&(f.game===anyGame||g.game===f.game)
    &&(!f.role.length||g.roles.some(role=>f.role.includes(role)))
    &&(f.rank==='Любой'||g.rank==='Любой'||games[g.game].ranks.indexOf(g.rank)>=games[g.game].ranks.indexOf(f.rank))
    &&(!f.language.length||f.language.includes(g.language))
    &&(!f.period.length||f.period.includes(g.period))&&matchesScheduleDate(g,f.date));
}
function searchView(){
  const results=searchResults(), f=ui.filters;
  const activeCount=[f.game!==anyGame,f.role.length,f.language.length,f.period.length,f.rank!=='Любой',f.date].filter(Boolean).length;
  const filterIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--panel)"/><circle cx="15" cy="17" r="2" fill="var(--panel)"/></svg>';
  return title('Найди свою команду')+`<div class="search-controls">${tabs([['team','Команды'],['lobby','Лобби']],ui.searchType,'search-tab')}<button class="filter-toggle" data-action="filters">${filterIcon}<span>Фильтры</span>${activeCount?`<span class="filter-count" aria-label="Активных фильтров: ${activeCount}">${activeCount}</span>`:''}</button></div>${results.length?`<p class="muted spacer">Найдено: ${results.length}</p><div class="grid search-results">${results.map(teamCard).join('')}</div>`:`<div class="center"><div class="symbol">${svg('search')}</div><h2>Нет подходящих ${ui.searchType==='team'?'команд':'лобби'}</h2><div class="actions">${button('Сбросить фильтры','reset-filters',{secondary:true})}</div></div>`}`;
}
function filtersView(){
  const f=ui.draftFilters||{...ui.filters};
  ui.draftFilters=f;
  const game=games[f.game];
  return title('Фильтры поиска','search')+`<form id="filters-form" class="narrow fields">${choices('game','Игра',[anyGame,...Object.keys(games)],f.game)}${choices('type','Формат',['Команда','Лобби'],f.type||(ui.searchType==='team'?'Команда':'Лобби'))}${game?choices('role','Роль в '+f.game,['Любая',...game.roles],f.role)+choices('rank','Ранг от',['Любой',...game.ranks],f.rank):''}${choices('language','Язык',['Любой','Русский','English'],f.language)}${choices('period','Время суток',['Любое',...periods],f.period)}${field('filter-date','Дата игры',input('filter-date',f.date,'type="date"'))}<div class="actions">${submit('Показать '+((f.type||(ui.searchType==='team'?'Команда':'Лобби'))==='Команда'?'команды':'лобби'))}${button('Сбросить','clear-filter-draft',{secondary:true})}</div></form>`;
}
function teamView(){
  const g=group(route.id);
  if(!g)return missing();
  const mine=g.members.includes('me'), isOwner=g.owner==='me', application=ownApplication(g), open=g.active&&capacity(g)>0;
  const action=isOwner?button('Входящие заявки','go',{screen:'incoming',id:g.id}):mine?button('Открыть чат','open-group-chat',{id:g.id}):application?button('Моя заявка','go',{screen:'application',id:application.id}):button(g.type==='team'?'Вступить в команду':'Вступить в лобби','go',{screen:'apply',id:g.id,disabled:!open});
  return title(g.name,mine?'groups':'search')+`<div class="content"><div class="banner"><span class="monogram">${esc(initials(g.name))}</span><span class="${open?'open':'muted'}">${open?'Набор открыт':'Набор завершён'}</span></div><dl class="meta"><div><dt>Игра</dt><dd>${esc(g.game)}</dd></div><div><dt>Формат</dt><dd>${g.type==='team'?'Постоянная команда':'Лобби на одну игру'}</dd></div><div><dt>Ранг</dt><dd>${esc(g.rank)}</dd></div><div><dt>Язык общения</dt><dd>${esc(g.language)}</dd></div><div><dt>Расписание</dt><dd>${esc(scheduleText(g))}</dd></div></dl>${g.goal?`<div class="section"><h2>Цель</h2><p class="muted">${esc(g.goal)}</p></div>`:''}<div class="section"><h2>Состав</h2><p class="muted spacer">${g.members.length} из ${g.capacity} участников. Свободных мест: <strong class="note">${capacity(g)}</strong></p><div class="avatars">${g.members.map((id,i)=>`<button class="member" data-action="go" data-screen="player" data-id="${esc(id)}">${avatar(id,i)}<span>${esc(player(id)?.nick)}<small>${id===g.owner?'Капитан':id==='me'?'Вы':'Участник'}</small></span></button>`).join('')}</div></div>${open&&g.roles.length?`<div class="section"><h2>Открытые роли</h2><p class="note">${esc(g.roles.join(', '))}</p></div>`:''}${g.description||g.recruitText||g.parent?`<div class="section"><h2>О ${g.type==='team'?'команде':'лобби'}</h2>${g.description?'<p class="muted">'+esc(g.description)+'</p>':''}${g.recruitText?'<p class="muted">'+esc(g.recruitText)+'</p>':''}${g.parent?link('Команда: '+group(g.parent)?.name,'team',g.parent):''}</div>`:''}<div class="actions">${action}${isOwner?button('Открыть чат','open-group-chat',{id:g.id,secondary:true}):''}${link('Профиль капитана','player',g.owner)}</div></div>`;
}
function playerView(){let p=player(route.id);if(!p)return missing();let isMe=p.id==='me',game=ui.playerGame||'Dota 2',profile=isMe?db.user.profiles.find(x=>x.game===game):game==='Dota 2'?p:null;return title(isMe?'Мой профиль игрока':'Профиль игрока','groups')+`<div class="narrow"><div class="person">${avatar(p.id)}<div><h2>${esc(p.nick)}</h2><small>${isMe?'Это вы':p.hours+' часов в игре'}</small></div></div><div class="section"><h2>${esc(game)}</h2><div class="tags"><span class="tag">${esc(profile?.rank||'Ранг не указан')}</span><span class="tag note">${esc(profile?.role||'Роль не указана')}</span></div></div><div class="section"><h2>Предпочтения</h2><p class="muted">${esc(isMe?db.user.language:'Русский')}<br>${esc(isMe?db.user.schedule:'Пн–Пт: 19:00–23:00')}<br>${esc(isMe?db.user.goal:'Рейтинговые матчи на результат').replace(/\s*·\s*/g, ', ')}</p></div><div class="card section"><h3>О себе</h3><p class="muted">${esc(p.about||'Ищу спокойную команду для регулярных матчей.')}</p></div><div class="actions">${isMe?button('Изменить профиль','go',{screen:'edit'}):button('Написать игроку','dm',{id:p.id})}</div></div>`}
function applyView(){
  const g=group(route.id);
  if(!g)return missing();
  if(g.members.includes('me'))return title('Вы уже в составе','team/'+g.id)+missing('Откройте команду или лобби в разделе «Мои команды».');
  const application=ownApplication(g);
  if(application)return applicationView(application);
  if(!g.active||!capacity(g))return title('Набор завершён','team/'+g.id)+missing('Свободных мест нет.');
  const roles=g.roles.length?g.roles:games[g.game].roles;
  const d=ui.applicationDraft[g.id]||{role:roles[0],text:''};
  return title('Заявка '+(g.type==='team'?'в команду':'в лобби'),'team/'+g.id)+`<form id="apply-form" class="narrow fields" data-group="${esc(g.id)}"><div class="card"><h3>${esc(g.name)}</h3><p class="muted">${esc(g.game)}, ${esc(g.rank)}</p><p class="note">Свободных мест: ${capacity(g)}</p></div>${field('role','Ваша игровая роль',select('role',roles,d.role))}${field('text','Сообщение капитану (необязательно)',textarea('text',d.text,'maxlength="1000" placeholder="Например, когда вам удобно играть"'))}${submit('Отправить заявку')}</form>`;
}
function applicationView(selected){let a=selected||db.applications.find(x=>x.id===route.id&&x.player==='me');if(!a)return missing();let g=group(a.group);return title(a.status==='pending'?'Заявка отправлена':'Моя заявка','applications')+`<div class="center"><div class="symbol round">${svg(a.status==='accepted'?'check':a.status==='pending'?'check':'messages')}</div><h2>${({pending:'Ждёт решения',accepted:'Вас приняли',rejected:'В этот раз не подошло',withdrawn:'Заявка отозвана'})[a.status]}</h2><p>${({pending:'Решение появится в разделе «Мои заявки».',accepted:'Вы добавлены в состав. Познакомьтесь с другими игроками в чате.',rejected:'Вы можете подобрать другую команду или лобби в поиске.',withdrawn:'Заявка больше не участвует в наборе.'})[a.status]}</p><div class="card"><h3>${esc(g?.name)}</h3><p class="muted">${metadata(g?.game, a.role, shortDate(a.created))}</p>${a.text?`<p>${esc(a.text)}</p>`:''}${link('Посмотреть состав','team',g.id)}</div><div class="actions">${a.status==='accepted'?button('Открыть чат','open-group-chat',{id:g.id}):button('Мои заявки','go',{screen:'applications'})}${a.status==='pending'?button('Отозвать заявку','withdraw',{id:a.id,secondary:true}):button('Вернуться к поиску','go',{screen:'search',secondary:true})}</div></div>`}
function groupsView(){let all=db.groups.filter(g=>g.members.includes('me')),teams=all.filter(g=>g.type==='team'),lobbies=all.filter(g=>g.type==='lobby'),pending=db.applications.filter(a=>group(a.group)?.owner==='me'&&a.status==='pending'),outgoing=db.applications.filter(a=>a.player==='me'&&a.status==='pending');let list=ui.groupType==='team'?teams:lobbies;return `<div class="dashboard-head"><div>${title('Мои команды')}</div>${button('Создать команду или лобби','create-group')}</div><div class="dashboard-layout"><section><div class="toolbar">${tabs([['team','Команды ('+teams.length+')'],['lobby','Лобби ('+lobbies.length+')'],['applications','Мои заявки']],ui.groupType,'group-tab')}</div><div class="squads">${list.length?list.map(summaryCard).join(''):`<div class="empty-inline"><h3>Здесь пока пусто</h3><p>Найдите подходящий состав или создайте свой.</p>${link('Перейти к поиску','search')}</div>`}</div></section><aside class="dashboard-aside"><section class="card"><h2>Требует внимания</h2>${pending.length?`<p class="muted">${pending.length} заявки ждут решения.</p>${[...new Set(pending.map(a=>a.group))].map(id=>`<button class="attention" data-action="go" data-screen="incoming" data-id="${id}"><strong>${esc(group(id).name)}</strong><span>Рассмотреть (${pending.filter(a=>a.group===id).length}) →</span></button>`).join('')}`:'<p class="muted">Все заявки разобраны.</p>'}</section><section class="card"><h2>Ваши лобби</h2>${lobbies.length?lobbies.map(g=>`<div class="session"><strong>${esc(g.name)}</strong><p class="note">${esc(scheduleText(g))}</p><small>${metadata(g.game, `${g.members.length} из ${g.capacity} игроков`)}</small>${link('Перейти в чат','chat',ensureGroupChat(g).id)}</div>`).join(''):'<p class="muted">Присоединитесь к лобби, чтобы сыграть вместе сегодня.</p>'}</section><section class="card"><h2>Мои заявки</h2><p class="muted">${outgoing.length?'Ждут ответа: '+outgoing.length:'Все заявки рассмотрены.'}</p>${link('Посмотреть мои заявки','applications')}</section></aside></div>`}

function applicationsView(){let all=db.applications.filter(a=>a.player==='me').sort((a,b)=>b.created-a.created),filter=ui.applicationFilter||'all',as=all.filter(a=>filter==='all'||a.status===filter);return title('Мои заявки','groups')+`<div class="application-workspace"><section>${tabs([['all','Все ('+all.length+')'],['pending','Ждут решения'],['accepted','Приняты'],['rejected','Отклонены'],['withdrawn','Отозваны']],filter,'application-filter')}<div class="list">${as.length?as.map(a=>{let g=group(a.group);if(!g)return '';return `<article class="card application-card"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><div><h3>${esc(g.name)}</h3><small>${metadata(g.game, g.type==='team'?'Команда':'Лобби')}</small></div>${badge(a.status)}</div><dl class="meta"><div><dt>Ваша роль</dt><dd>${esc(a.role)}</dd></div><div><dt>Отправлена</dt><dd>${shortDate(a.created)}</dd></div></dl>${a.text?`<h4>Ваше сообщение</h4><p class="application-message">${esc(a.text)}</p>`:''}<div class="squad-actions">${button('Посмотреть '+(g.type==='team'?'команду':'лобби'),'go',{screen:'team',id:g.id,secondary:true})}${a.status==='accepted'?button('Открыть чат','open-group-chat',{id:g.id}):button('Подробнее о заявке','go',{screen:'application',id:a.id,secondary:true})}</div>${a.status==='pending'?`<div class="application-footer"><button class="link" data-action="dm" data-id="${g.owner}">Написать капитану</button><button class="link" data-action="withdraw" data-id="${a.id}">Отозвать заявку</button></div>`:''}</article>`}).join(''):`<div class="empty-inline"><h3>${all.length?'Таких заявок пока нет':'Вы ещё не отправляли заявки'}</h3><p>${all.length?'Выберите другой статус, чтобы увидеть остальные отклики.':'Выберите команду или лобби в поиске.'}</p>${button(all.length?'Показать все заявки':'Найти команду',all.length?'application-filter':'go',all.length?{value:'all',secondary:true}:{screen:'search'})}</div>`}</div></section></div>`}

function createView(){return title('Создать команду или лобби','groups')+`<div class="center"><div class="symbol">${svg('star')}</div><h2>Нужна подписка</h2><p>WithTeam Plus позволяет создавать постоянные команды и временные лобби.</p><div class="actions">${button('Посмотреть тарифы','go',{screen:'subscription'})}${button('Вернуться к моим командам','go',{screen:'groups',secondary:true})}</div></div>`}
function draft(){
  return ui.newDraft||(ui.newDraft={type:'team',name:'',game:'Dota 2',goal:'Регулярные рейтинговые матчи',language:'Русский',startsOn:'',startsAt:'20:00',endsAt:'',repeatsWeekly:false,description:'',parent:''});
}
function validGroupDraft(d){
  return d.name.trim()&&validDate(d.startsOn)&&d.startsOn>=todayDate()&&validTime(d.startsAt)
    &&(!d.endsAt||(validTime(d.endsAt)&&d.endsAt!==d.startsAt));
}
function lobbyParentField(d){
  const teams=db.groups.filter(g=>g.type==='team'&&g.owner==='me'&&g.game===d.game).map(g=>[g.id,g.name]);
  return teams.length?field('parent','Привязка к команде',select('parent',[['','Самостоятельное лобби'],...teams],d.parent)):'<div class="field lobby-format"><span class="field-label">Привязка к команде</span><p>Самостоятельное лобби</p></div>';
}
function newView(){
  if(!db.plus)return createView();
  const d=draft(), team=d.type==='team';
  return title(team?'Новая команда':'Новое лобби','groups')+`<form id="new-form" class="content fields"><div class="form-grid">${field('type','Формат',select('type',[['team','Постоянная команда'],['lobby','Лобби на одну игру']],d.type))}${field('name',team?'Название команды':'Название лобби',input('name',d.name,'required maxlength="60" placeholder="Например, Ancient Squad"'))}${field('game','Игра',select('game',Object.keys(games),d.game))}${field('language','Язык',select('language',['Русский','English'],d.language))}<div${team?' class="wide"':''}>${field('goal','Цель (необязательно)',input('goal',d.goal,'maxlength="140"'))}</div>${team?'':lobbyParentField(d)}<fieldset class="wide schedule-fields"><legend>Расписание</legend><div class="form-grid">${field('startsOn',team?'Дата первой игры':'Дата игры',input('startsOn',d.startsOn,`type="date" min="${todayDate()}" required`))}<div class="schedule-period"><span class="field-label">Время суток</span><output id="schedule-period" for="startsAt">${d.startsAt?timePeriod(d.startsAt):'Укажите время начала'}</output></div>${field('startsAt','Начало',input('startsAt',d.startsAt,'type="time" required'))}${field('endsAt','Окончание (необязательно)',input('endsAt',d.endsAt,'type="time"'))}</div>${team?`<label class="schedule-repeat"><input type="checkbox" name="repeatsWeekly" ${d.repeatsWeekly?'checked':''}> Повторять еженедельно</label>`:''}<p id="schedule-error" class="error" role="alert" hidden></p></fieldset><div class="wide">${field('description','Описание (необязательно)',textarea('description',d.description,'maxlength="1500"'))}</div></div>${submit('Перейти к условиям набора')}</form>`;
}
function requirementsView(){
  if(!db.plus)return createView();
  const d=draft();
  if(!validGroupDraft(d))return newView();
  const game=games[d.game], maxVacancies=game.teamSize-1;
  const r=ui.recruitDraft||(ui.recruitDraft={roles:[game.roles[0]],rank:'Любой',capacity:game.teamSize,text:''});
  const vacancies=r.capacity-1;

  if (signedOut) {
    finishCall();
    Object.assign(ui, {newDraft:null,recruitDraft:null,applicationDraft:{},draftFilters:null,profileGame:null,playerGame:null});
    document.getElementById('toast')?.remove();
  }
  db.signedOut = signedOut;
  persist();
  replaceRoute(signedOut ? 'signin' : 'profile');
  readRoute();
}
function captureNew(form){
  const data=new FormData(form), values=Object.fromEntries(data), previous=draft();
  const gameChanged=values.game!==previous.game;
  if(gameChanged)ui.recruitDraft=null;
  const parent=group(values.parent);
  if(values.type==='team'||parent?.type!=='team'||parent?.game!==values.game||parent?.owner!=='me')values.parent='';
  values.repeatsWeekly=values.type==='team'&&data.has('repeatsWeekly');
  ui.newDraft={...previous,...values};
  return ui.newDraft;
}
function captureRecruit(form){
  const data=new FormData(form), input=form.elements.capacity;
  const vacancies=input.valueAsNumber, valid=Number.isInteger(vacancies)&&vacancies>=Number(input.min)&&vacancies<=Number(input.max);
  const capacity=valid?vacancies+1:ui.recruitDraft.capacity;
  ui.recruitDraft={roles:data.getAll('roles'),rank:form.elements.rank.value,capacity,text:form.elements.text.value};
  document.getElementById('vacancies').textContent=valid?capacity:'—';
  form.querySelector('[data-delta="-1"]').disabled=valid&&vacancies<=Number(input.min);
  form.querySelector('[data-delta="1"]').disabled=valid&&vacancies>=Number(input.max);
}
function ensureGroupChat(g){let c=db.chats.find(c=>c.group===g.id);if(!c){c={id:newId('chat'),group:g.id,messages:[]};db.chats.push(c);persist()}return c}
function decide(id,status){let a=db.applications.find(a=>a.id===id),g=a&&group(a.group);if(!a||!g||g.owner!=='me'||a.status!=='pending')return toast('Эта заявка уже обработана.');if(status==='accepted'){if(!capacity(g))return toast('Состав уже собран. Нового игрока пока добавить нельзя.');if(!g.members.includes(a.player))g.members.push(a.player);if(capacity(g)>0&&g.roles.length>1)g.roles=g.roles.filter(role=>role!==a.role);if(!capacity(g))g.active=false;ensureGroupChat(g)}a.status=status;a.decided=Date.now();persist();go('incoming',g.id);toast(status==='accepted'?'Игрок принят в состав':'В этот раз не подошло')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let {action,screen,id,value,field:filterField,status}=b.dataset;
if(action==='sign-in')return changeSignIn(false);
if(db.signedOut)return;
if(action==='application-filter'){ui.applicationFilter=value;render();return}if(action==='back'){if(history.state?.withteam)history.back();else go(screen,id);return}if(action==='seats'){let input=document.getElementById('capacity');input.value=Math.min(Number(input.max),Math.max(Number(input.min),Math.trunc(Number(input.value))+Number(b.dataset.delta)));input.dispatchEvent(new Event('input',{bubbles:true}));return}if(action==='go'){if(screen==='games')ui.profileGame=null;if(screen==='player'&&group(route.id))ui.playerGame=group(route.id).game;if(route.screen==='new'){let f=document.getElementById('new-form');if(f)captureNew(f)}go(screen,id);}
if(action==='search-tab'){ui.searchType=value;render()}
if(action==='group-tab'){if(value==='applications')go('applications');else{ui.groupType=value;render()}}
if(action==='message-tab'){ui.messageType=value;render()}
if(action==='filters'){ui.draftFilters={...ui.filters,type:ui.searchType==='team'?'Команда':'Лобби'};go('filters')}
if(action==='filter-choice'){
  let f=ui.draftFilters, selected=f[filterField];
  if(Array.isArray(selected)){
    let unrestricted=['Любая','Любой','Любое'].includes(value);
    f[filterField]=unrestricted?[]:selected.includes(value)?selected.filter(item=>item!==value):[...selected,value];
  }else{
    f[filterField]=value;
    if(filterField==='game'&&value!==selected){f.role=[];f.rank='Любой'}
  }
  let scroll=window.scrollY;
  render();
  window.scrollTo({top:scroll,behavior:'instant'});
  Array.from(app.querySelectorAll(`[data-field="${filterField}"]`))
    .find(option=>option.dataset.value===value)?.focus({preventScroll:true});
}
if(action==='reset-filters'){ui.filters=defaultFilters();render()}
if(action==='clear-filter-draft'){ui.draftFilters={...defaultFilters(),type:ui.searchType==='team'?'Команда':'Лобби'};render()}
if(action==='create-group')go(db.plus?'new':'create');
if(action==='activate-plus'){db.plus=true;persist();go('new');toast('Plus включён для демонстрации. Оплаты нет.')}
if(action==='withdraw'){let a=db.applications.find(a=>a.id===id&&a.player==='me');if(a?.status==='pending'){a.status='withdrawn';persist();render();toast('Заявка отозвана')}}
if(action==='open-group-chat'){let g=group(id);if(g?.members.includes('me'))go('chat',ensureGroupChat(g).id)}
if(action==='dm'){if(id==='me')return go('profile');if(!player(id))return;let c=db.chats.find(c=>c.peer===id);if(!c){c={id:newId('dm'),peer:id,messages:[]};db.chats.push(c);persist()}go('chat',c.id)}
if(action==='decide')decide(id,status);
if(action==='start-call')startCall(id);
if(action==='return-call'&&ui.call)go('call',ui.call.id);
if(action==='toggle-call-media')toggleCallMedia(value);
if(action==='end-call')endCall();
if(action==='sign-out')changeSignIn(true);
});
document.addEventListener('input',e=>{
  const form=e.target.closest('form');
  if(!form)return;
  if(form.id==='apply-form')ui.applicationDraft[form.dataset.group]=Object.fromEntries(new FormData(form));
  if(form.id==='filters-form'&&e.target.name==='filter-date')ui.draftFilters.date=e.target.value;
  if(form.id==='new-form'){
    const d=captureNew(form);
    document.getElementById('schedule-period').textContent=d.startsAt?timePeriod(d.startsAt):'Укажите время начала';
    document.getElementById('schedule-error').hidden=true;
  }
  if(form.id==='recruit-form')captureRecruit(form);
});
document.addEventListener('change',e=>{let f=e.target.closest('form');if(!f)return;if(f.id==='new-form'){captureNew(f);if(['type','game'].includes(e.target.name)){render();document.getElementById(e.target.name)?.focus({preventScroll:true})}}if(f.id==='settings-form'&&route.screen==='games'&&e.target.name==='game'){ui.profileGame=e.target.value;let g=games[e.target.value],p=db.user.profiles.find(p=>p.game===e.target.value);f.elements.rank.innerHTML=g.ranks.map(v=>`<option ${v===p?.rank?'selected':''}>${esc(v)}</option>`).join('');f.elements.role.innerHTML=g.roles.map(v=>`<option ${v===p?.role?'selected':''}>${esc(v)}</option>`).join('')}});
document.addEventListener('submit',e=>{let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();if(db.signedOut)return;let data=new FormData(f),v=Object.fromEntries(data);
if(f.id==='filters-form'){let {type,...filters}=ui.draftFilters;filters.date=v['filter-date'];ui.filters=filters;ui.searchType=type==='Лобби'?'lobby':'team';go('search')}
if(f.id==='apply-form'){let g=group(f.dataset.group);if(!g||g.members.includes('me')||ownApplication(g)||!g.active||!capacity(g))return toast('Нельзя отправить заявку. Обновите страницу команды или лобби.');if(!(g.roles.length?g.roles:games[g.game].roles).includes(v.role))return toast('Выберите доступную роль.');let a={id:newId('application'),group:g.id,player:'me',role:v.role,text:v.text.trim(),status:'pending',created:Date.now()};db.applications.push(a);persist();delete ui.applicationDraft[g.id];go('application',a.id)}
if(f.id==='new-form'){
  const d=captureNew(f);
  if(!d.name.trim())return toast('Введите название.');
  if(!validGroupDraft(d)){
    const error=document.getElementById('schedule-error');
    error.textContent=d.startsAt===d.endsAt?'Укажите разное время начала и окончания.':'Проверьте дату и время игры.';
    error.hidden=false;
    return;
  }
  go('requirements');
}
if(f.id==='recruit-form'){
  if(!db.plus)return go('subscription');
  const d=draft();
  if(!validGroupDraft(d))return go('new');
  const game=games[d.game], roles=data.getAll('roles').filter(role=>game.roles.includes(role));
  const capacity=Number(v.capacity)+1, error=document.getElementById('recruit-error');
  if(!roles.length){error.textContent='Выберите хотя бы одну игровую роль.';return;}
  if(!Number.isInteger(capacity)||capacity<2||capacity>game.teamSize){error.textContent='Укажите от 1 до '+(game.teamSize-1)+' игроков.';return;}
  const g={id:newId('group'),...d,name:d.name.trim(),goal:d.goal.trim(),description:d.description.trim(),owner:'me',members:['me'],capacity,rank:v.rank,roles,active:true,recruitText:v.text.trim(),schedule:scheduleLabel(d),period:timePeriod(d.startsAt)};
  db.groups.push(g);
  ensureGroupChat(g);
  ui.newDraft=null;
  ui.recruitDraft=null;
  go('published',g.id);
}
if(f.id==='message-form'){let text=v.message.trim(),c=db.chats.find(c=>c.id===route.id);if(!text||!hasChatAccess(c))return;c.messages.push({author:'me',text,created:Date.now()});persist();render();document.getElementById('message')?.focus()}
if(f.id==='settings-form'){let s=route.screen;if(s==='edit'){if(!v.nick.trim())return toast('Введите ник.');db.user.nick=v.nick.trim();db.user.about=v.about.trim()}if(s==='preferences'){db.user.language=v.language;db.user.schedule=v.schedule.trim();db.user.goal=v.goal.trim()}if(s==='games'){let p={game:v.game,rank:v.rank,role:v.role},index=db.user.profiles.findIndex(p=>p.game===v.game);if(index<0)db.user.profiles.push(p);else db.user.profiles[index]=p;ui.profileGame=v.game;}if(s==='timezone')db.user.timezone=v.timezone;if(s==='notifications'){db.settings.applications=data.has('applications');db.settings.messages=data.has('messages')}if(s==='privacy'){db.settings.visible=data.has('visible');db.settings.allowDM=data.has('allowDM')}persist();go(['preferences','games'].includes(s)?'profile':'settings');toast('Изменения сохранены')}
});
function updateTimer() {
  if (!ui.call) return;
  const elapsed = Math.max(0, Date.now() - ui.call.started);
  document.querySelectorAll('[data-call-timer]').forEach(timer => {
    timer.textContent = durationTime(elapsed);
    timer.dateTime = `PT${Math.floor(elapsed / 1000)}S`;
  });
}
window.addEventListener('hashchange',readRoute);
window.addEventListener('popstate',readRoute);
window.addEventListener('storage',e=>{if(e.key!==STORAGE)return;try{let value=JSON.parse(e.newValue);if(value?.version===2&&value.groups&&value.user){db=value;readRoute()}}catch{}});
ui.call = restoreCall();
setInterval(updateTimer,1000);
readRoute();
</script>
</body>
</html>

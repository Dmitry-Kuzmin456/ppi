let db;let storageAvailable=true;try{let saved=JSON.parse(localStorage.getItem(STORAGE)||'null');db=saved?.version===2&&Array.isArray(saved.groups)&&saved.user&&Array.isArray(saved.chats)&&Array.isArray(saved.applications)&&saved.settings?saved:seed()}catch{db=seed()}

function href(screen,id=''){return '#'+screen+(id?'/'+encodeURIComponent(id):'')}

const group=id=>db.groups.find(g=>g.id===id);
const initials=name=>{let words=String(name).trim().split(/[\s_-]+/);return (words.length===1?words[0].slice(0,2):words.map(w=>w[0]||'').slice(0,2).join('')).toUpperCase()};
const capacity=g=>Math.max(0,g.capacity-g.members.length);

const chatName=c=>c.group?group(c.group)?.name:player(c.peer)?.nick;

const dateTime=n=>new Date(n).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:db.user.timezone});
const shortDate=n=>new Date(n).toLocaleDateString('ru-RU',{day:'numeric',month:'short',timeZone:db.user.timezone});
function button(text,action,options={}){let attrs=Object.entries(options).filter(([k])=>!['secondary','danger','disabled'].includes(k)).map(([k,v])=>`data-${k}="${esc(v)}"`).join(' ');return `<button type="button" class="${options.danger?'danger':options.secondary?'secondary':'primary'}" data-action="${action}" ${attrs} ${options.disabled?'disabled':''}>${text}</button>`}
function link(text,screen,id='',extra=''){return `<button type="button" class="link" data-action="go" data-screen="${screen}" data-id="${esc(id)}" ${extra}>${esc(text)}</button>`}
function title(text,back=''){if(!back&&!['search','groups','messages','profile'].includes(route.screen))back='groups';return `<header class="page-head">${back?`<button class="back" type="button" data-action="back" data-screen="${back.split('/')[0]}" data-id="${esc(back.split('/')[1]||'')}" aria-label="Назад">${svg('back')}</button>`:''}<h1 tabindex="-1">${esc(text)}</h1></header>`}
function tabs(items,selected,action){return `<div class="tabs">${items.map(([v,t])=>`<button class="chip" type="button" data-action="${action}" data-value="${v}" aria-pressed="${v===selected}">${t}</button>`).join('')}</div>`}
function choices(name,label,items,current){return `<div class="field"><fieldset><legend>${esc(label)}</legend><div class="options">${items.map(v=>`<button type="button" class="chip" data-action="filter-choice" data-field="${name}" data-value="${esc(v)}" aria-pressed="${v===current}">${esc(v)}</button>`).join('')}</div></fieldset></div>`}
function field(name,label,control){return `<div class="field"><label for="${name}">${esc(label)}</label>${control}</div>`}
function input(name,value,extra=''){return `<input id="${name}" name="${name}" value="${esc(value)}" ${extra}>`}
function select(name,values,value){return `<select id="${name}" name="${name}">${values.map(v=>{let [id,t]=Array.isArray(v)?v:[v,v];return `<option value="${esc(id)}" ${id===value?'selected':''}>${esc(t)}</option>`}).join('')}</select>`}
function textarea(name,value,extra=''){return `<textarea id="${name}" name="${name}" ${extra}>${esc(value)}</textarea>`}
const submit=text=>`<button type="submit" class="primary">${text}</button>`;
const badge=s=>`<span class="badge ${s==='accepted'?'good':s==='rejected'?'bad':s==='withdrawn'?'neutral':''}">${({pending:'Ждёт решения',accepted:'Принята',rejected:'Отклонена',withdrawn:'Отозвана'})[s]||esc(s)}</span>`;
function avatar(id,i=0){let p=player(id);return `<span class="avatar tint-${i%4}" aria-hidden="true">${esc(initials(p?.nick||'?'))}</span>`}

function teamCard(g){let mine=g.members.includes('me');return `<article class="card team"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><h3>${esc(g.name)}</h3><span class="count" aria-label="Участники">${g.members.length} / ${g.capacity}</span></div><p class="muted">${esc(g.game)} · ${g.type==='team'?'Ranked':'Лобби'} · ${esc(g.schedule)}</p><div class="tags"><span class="tag">${esc(g.rank)}</span><span class="tag">${esc(g.language)}</span><span class="tag">${esc(g.roles.join(', ')||'Состав собран')}</span>${mine?'<span class="tag note">Вы в составе</span>':''}</div><div class="cardfoot">${g.members.slice(0,3).map((id,i)=>avatar(id,i)).join('')}${link('Подробнее','team',g.id)}</div></article>`}
function summaryCard(g){let pending=db.applications.filter(a=>a.group===g.id&&a.status==='pending').length;return `<article class="card squad"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><div><h3>${esc(g.name)}</h3><small>${esc(g.game)} · ${g.owner==='me'?'Вы организатор':'Вы участник'}</small></div><span class="badge ${g.active?'good':'neutral'}">${g.active?'Набор открыт':'Состав собран'}</span></div><dl class="meta"><div><dt>Когда играем</dt><dd>${esc(g.schedule)}</dd></div><div><dt>Состав</dt><dd>${g.members.length} из ${g.capacity} · свободно ${capacity(g)}</dd></div></dl><div class="avatars">${g.members.slice(0,5).map((id,i)=>avatar(id,i)).join('')}</div><p class="muted">${esc(g.goal)}</p><div class="squad-actions">${button('Открыть чат','open-group-chat',{id:g.id,secondary:true})}${button('Посмотреть состав','go',{screen:'team',id:g.id,secondary:true})}</div>${g.owner==='me'?`<button class="review-applications" data-action="go" data-screen="incoming" data-id="${g.id}">${pending?'Ждут решения: '+pending:'Входящие заявки'} <span>Разобрать заявки →</span></button>`:''}</article>`}

function searchResults(){let f=ui.filters;return db.groups.filter(g=>g.active&&capacity(g)>0&&g.type===ui.searchType&&g.game===f.game&&(f.role==='Любая'||g.roles.includes(f.role))&&(f.rank==='Любой'||g.rank==='Любой'||games[g.game].ranks.indexOf(g.rank)>=games[g.game].ranks.indexOf(f.rank))&&(f.language==='Любой'||g.language===f.language)&&(f.period==='Любое'||g.period===f.period))}
function searchView(){let results=searchResults();return title('Найди свою команду')+tabs([['team','Команды'],['lobby','Лобби']],ui.searchType,'search-tab')+`<div class="filterbar" aria-label="Параметры поиска"><button data-action="filters">${esc(ui.filters.game)}</button><button data-action="filters">${ui.filters.rank==='Любой'?'Ранг':esc(ui.filters.rank)+'+'}</button><button data-action="filters">${ui.filters.role==='Любая'?'Роль':esc(ui.filters.role)}</button><button data-action="filters">Фильтры${Object.entries(ui.filters).filter(([k,v])=>k!=='game'&&!['Любая','Любой','Любое'].includes(v)).length?' · '+Object.entries(ui.filters).filter(([k,v])=>k!=='game'&&!['Любая','Любой','Любое'].includes(v)).length:''}</button></div>${results.length?`<p class="muted spacer">${ui.searchType==='team'?'Команды':'Лобби'} по вашим условиям · ${results.length}</p><div class="grid">${results.map(teamCard).join('')}</div>`:`<div class="center"><div class="symbol">${svg('search')}</div><h2>Нет подходящих ${ui.searchType==='team'?'команд':'лобби'}</h2><p>Попробуйте изменить игру, ранг, роль или время.</p><div class="actions">${button('Изменить фильтры','filters')}${button('Сбросить фильтры','reset-filters',{secondary:true})}</div></div>`}`}
function filtersView(){let f=ui.draftFilters||{...ui.filters};ui.draftFilters=f;return title('Фильтры поиска','search')+`<form id="filters-form" class="narrow fields">${choices('game','Игра',Object.keys(games),f.game)}${choices('type','Формат',['Команда','Лобби'],f.type||(ui.searchType==='team'?'Команда':'Лобби'))}${choices('role','Роль в '+f.game,['Любая',...games[f.game].roles],f.role)}${choices('rank','Ранг от',['Любой',...games[f.game].ranks],f.rank)}${choices('language','Язык',['Любой','Русский','English'],f.language)}${choices('period','Время',['Любое','Утро','День','Вечер','Ночь'],f.period)}<div class="actions">${submit('Показать '+((f.type||(ui.searchType==='team'?'Команда':'Лобби'))==='Команда'?'команды':'лобби'))}${button('Сбросить','clear-filter-draft',{secondary:true})}</div></form>`}
function teamView(){let g=group(route.id);if(!g)return missing();let mine=g.members.includes('me'),isOwner=g.owner==='me',a=ownApplication(g);return title(g.name,g.members.includes('me')?'groups':'search')+`<div class="content"><div class="banner"><span class="monogram">${esc(initials(g.name))}</span><span class="${g.active&&capacity(g)>0?'open':'muted'}">${g.active&&capacity(g)>0?'Набор открыт':'Набор завершён'}</span></div><dl class="meta"><div><dt>Игра и формат</dt><dd>${esc(g.game)} · ${g.type==='team'?'Постоянная команда':'Лобби на одну игру'}</dd></div><div><dt>Ранг</dt><dd>${esc(g.rank)}</dd></div><div><dt>Время игры</dt><dd>${esc(g.schedule)}</dd></div><div><dt>Язык общения</dt><dd>${esc(g.language)}</dd></div></dl><div class="section"><h2>Цель</h2><p class="muted">${esc(g.goal)}</p></div><div class="section"><h2>Состав · ${g.members.length} из ${g.capacity}</h2><p class="muted spacer">Свободных мест: <strong class="note">${capacity(g)}</strong></p><div class="avatars">${g.members.map((id,i)=>`<button class="member" data-action="go" data-screen="player" data-id="${id}">${avatar(id,i)}<span>${esc(player(id)?.nick)}<small>${id===g.owner?'Капитан':id==='me'?'Вы':'Участник'}</small></span></button>`).join('')}</div></div><div class="section"><h2>${capacity(g)>0?'Открытые роли':'Состав собран'}</h2><p class="note">${esc(capacity(g)>0?g.roles.join(', '):'Состав собран')}</p></div><div class="section"><h2>О ${g.type==='team'?'команде':'лобби'}</h2><p class="muted">${esc(g.description)}</p>${g.recruitText?'<p class="muted">'+esc(g.recruitText)+'</p>':''}${g.parent?link('Команда: '+group(g.parent)?.name,'team',g.parent):''}</div><div class="actions">${isOwner?button('Входящие заявки','go',{screen:'incoming',id:g.id}):mine?button('Вы в составе · Открыть чат','open-group-chat',{id:g.id}):a?button('Заявка на рассмотрении','go',{screen:'application',id:a.id}):button('Подать заявку','go',{screen:'apply',id:g.id,disabled:!g.active||!capacity(g)})}${isOwner?button('Открыть function playerView(){let p=player(route.id);if(!p)return missing();let isMe=p.id==='me',game=ui.playerGame||'Dota 2',profile=isMe?db.user.profiles.find(x=>x.game===game):game==='Dota 2'?p:null;return title(isMe?'Мой профиль игрока':'Профиль игрока','groups')+`<div class="narrow"><div class="person">${avatar(p.id)}<div><h2>${esc(p.nick)}</h2><small>${isMe?'Это вы':p.hours+' часов в игре'}</small></div></div><div class="section"><h2>${esc(game)}</h2><div class="tags"><span class="tag">${esc(profile?.rank||'Ранг не указан')}</span><span class="tag note">${esc(profile?.role||'Роль не указана')}</span></div></div><div class="section"><h2>Предпочтения</h2><p class="muted">${esc(isMe?db.user.language:'Русский')}<br>${esc(isMe?db.user.schedule:'Пн–Пт: 19:00–23:00')}<br>${esc(isMe?db.user.goal:'Ranked · Игра на результат')}</p></div><div class="card section"><h3>О себе</h3><p class="muted">${esc(p.about||'Ищу спокойную команду для регулярных матчей.')}</p></div><div class="actions">${isMe?button('Изменить профиль','go',{screen:'edit'}):button('Написать игроку','dm',{id:p.id})}</div></div>`}
function applyView(){let g=group(route.id);if(!g)return missing();if(g.members.includes('me'))return title('Вы уже в составе','team/'+g.id)+missing('Вы уже участвуете в этой команде или лобби. Новая заявка не нужна.');if(ownApplication(g))return applicationView(ownApplication(g));if(!g.active||!capacity(g))return title('Набор завершён','team/'+g.id)+missing('В этой команде или лобби сейчас нет свободных мест.');let d=ui.applicationDraft[g.id]||{role:g.roles[0]||games[g.game].roles[0],text:''};return title('Заявка '+(g.type==='team'?'в команду':'в лобби'),'team/'+g.id)+`<form id="apply-form" class="narrow fields" data-group="${g.id}"><div class="card"><h3>${esc(g.name)}</h3><p class="muted">${esc(g.game)} · ${esc(g.rank)}</p><p class="note">Свободных мест: ${capacity(g)}</p></div>${field('role','Ваша игровая роль',select('role',g.roles.length?g.roles:games[g.game].roles,d.role))}${field('text','Сообщение капитану',textarea('text',d.text,'required minlength="5" maxlength="1000" placeholder="Расскажите о своём опыте и удобном времени игры"'))}<p class="hint">Капитан увидит ваш игровой профиль и сообщение.</p>${submit('Отправить заявку')}</form>`}
function applicationView(selected){let a=selected||db.applications.find(x=>x.id===route.id&&x.player==='me');if(!a)return missing();let g=group(a.group);return title(a.status==='pending'?'Заявка отправлена':'Моя заявка','applications')+`<div class="center"><div class="symbol round">${svg(a.status==='accepted'?'check':a.status==='pending'?'check':'messages')}</div><h2>${({pending:'Ждёт решения',accepted:'Вас приняли',rejected:'В этот раз не подошло',withdrawn:'Заявка отозвана'})[a.status]}</h2><p>${({pending:'Решение появится в разделе «Мои заявки».',accepted:'Вы добавлены в состав. Познакомьтесь с другими игроками в чате.',rejected:'Вы можете подобрать другую команду или лобби в поиске.',withdrawn:'Заявка больше не участвует в наборе.'})[a.status]}</p><div class="card"><h3>${esc(g?.name)}</h3><p class="muted">${esc(g?.game)} · ${esc(a.role)} · ${shortDate(a.created)}</p><p>${esc(a.text)}</p>${link('Посмотреть состав','team',g.id)}</div><div class="actions">${a.status==='accepted'?button('Открыть чат','open-group-chat',{id:g.id}):button('Мои заявки','go',{screen:'applications'})}${a.status==='pending'?button('Отозвать заявку','withdraw',{id:a.id,secondary:true}):button('Вернуться к поиску','go',{screen:'search',secondary:true})}</div></div>`}
function groupsView(){let all=db.groups.filter(g=>g.members.includes('me')),teams=all.filter(g=>g.type==='team'),lobbies=all.filter(g=>g.type==='lobby'),pending=db.applications.filter(a=>group(a.group)?.owner==='me'&&a.status==='pending'),outgoing=db.applications.filter(a=>a.player==='me'&&a.status==='pending');let list=ui.groupType==='team'?teams:lobbies;return `<div class="dashboard-head"><div>${title('Мои команды')}</div>${button('Создать команду или лобби','create-group')}</div><div class="dashboard-layout"><section><div class="toolbar">${tabs([['team','Команды · '+teams.length],['lobby','Лобби · '+lobbies.length],['applications','Мои заявки']],ui.groupType,'group-tab')}</div><div class="squads">${list.length?list.map(summaryCard).join(''):`<div class="empty-inline"><h3>Здесь пока пусто</h3><p>Найдите подходящий состав или создайте свой.</p>${link('Перейти к поиску','search')}</div>`}</div></section><aside class="dashboard-aside"><section class="card"><h2>Требует внимания</h2>${pending.length?`<p class="muted">${pending.length} заявки ждут вашего решения. Посмотрите роли и познакомьтесь с игроками.</p>${[...new Set(pending.map(a=>a.group))].map(id=>`<button class="attention" data-action="go" data-screen="incoming" data-id="${id}"><strong>${esc(group(id).name)}</strong><span>${pending.filter(a=>a.group===id).length} заявки · Рассмотреть →</span></button>`).join('')}`:'<p class="muted">Все заявки разобраны. Можно договориться о следующей игре в чате.</p>'}</section><section class="card"><h2>Ваши лобби</h2>${lobbies.length?lobbies.map(g=>`<div class="session"><strong>${esc(g.name)}</strong><p class="note">${esc(g.schedule)}</p><small>${esc(g.game)} · ${g.members.length} из ${g.capacity} игроков</small>${link('Перейти в чат','chat',ensureGroupChat(g).id)}</div>`).join(''):'<p class="muted">Присоединитесь к лобби, чтобы сыграть вместе сегодня.</p>'}</section><section class="card"><h2>Мои заявки</h2><p class="muted">${outgoing.length?'Ждут ответа: '+outgoing.length:'Здесь можно проверить решения по вашим откликам.'}</p>${link('Посмотреть мои заявки','applications')}</section></aside></div>`}

function applicationsView(){let all=db.applications.filter(a=>a.player==='me').sort((a,b)=>b.created-a.created),filter=ui.applicationFilter||'all',as=all.filter(a=>filter==='all'||a.status===filter);return title('Мои заявки','groups')+`<div class="application-workspace"><section>${tabs([['all','Все · '+all.length],['pending','Ждут решения'],['accepted','Приняты'],['rejected','Отклонены'],['withdrawn','Отозваны']],filter,'application-filter')}<div class="list">${as.length?as.map(a=>{let g=group(a.group);if(!g)return '';return `<article class="card application-card"><div class="teamtop"><span class="gameicon">${games[g.game].icon}</span><div><h3>${esc(g.name)}</h3><small>${esc(g.game)} · ${g.type==='team'?'Команда':'Лобби'}</small></div>${badge(a.status)}</div><dl class="meta"><div><dt>Ваша роль</dt><dd>${esc(a.role)}</dd></div><div><dt>Отправлена</dt><dd>${shortDate(a.created)}</dd></div></dl><h4>Ваше сообщение</h4><p class="application-message">${esc(a.text)}</p><div class="squad-actions">${button('Посмотреть '+(g.type==='team'?'команду':'лобби'),'go',{screen:'team',id:g.id,secondary:true})}${a.status==='accepted'?button('Открыть чат','open-group-chat',{id:g.id}):button('Подробнее о заявке','go',{screen:'application',id:a.id,secondary:true})}</div>${a.status==='pending'?`<div class="application-footer"><button class="link" data-action="dm" data-id="${g.owner}">Написать капитану</button><button class="link" data-action="withdraw" data-id="${a.id}">Отозвать заявку</button></div>`:''}</article>`}).join(''):`<div class="empty-inline"><h3>${all.length?'Таких заявок пока нет':'Вы ещё не отправляли заявки'}</h3><p>${all.length?'Выберите другой статус, чтобы увидеть остальные отклики.':'Выберите команду или лобби в поиске и расскажите немного о себе.'}</p>${button(all.length?'Показать все заявки':'Найти команду',all.length?'application-filter':'go',all.length?{value:'all',secondary:true}:{screen:'search'})}</div>`}</div></section><aside class="card application-help"><h2>Что дальше?</h2><ol><li><strong>Капитан читает заявку</strong><p>Он увидит вашу роль, сообщение и игровой профиль.</p></li><li><strong>Решение появится здесь</strong><p>После принятия станут доступны состав и командный чат.</p></li><li><strong>Планы изменились?</strong><p>Заявку можно отозвать, пока она ждёт решения.</p></li></ol>${button('Продолжить поиск','go',{screen:'search',secondary:true})}</aside></div>`}

function createView(){return title('Создать команду или лобби','groups')+`<div class="center"><div class="symbol">${svg('star')}</div><h2>Нужна подписка</h2><p>WithTeam Plus позволяет создавать постоянные команды и временные лобби.</p><div class="actions">${button('Посмотреть тарифы','go',{screen:'subscription'})}${button('Вернуться к моим командам','go',{screen:'groups',secondary:true})}</div></div>`}
function draft(){return ui.newDraft||(ui.newDraft={type:'team',name:'',game:'Dota 2',goal:'Регулярные рейтинговые матчи',language:'Русский',schedule:'Пн–Пт · 20:00–23:00',period:'Вечер',description:'',parent:''})}
function newView(){if(!db.plus)return createView();let d=draft();return title(d.type==='team'?'Новая команда':'Новое лобби','groups')+`<form id="new-form" class="content fields"><div class="form-grid">${field('type','Формат',select('type',[['team','Постоянная команда'],['lobby','Лобби на одну игру']],d.type))}${field('name',d.type==='team'?'Название команды':'Название лобби',input('name',d.name,'required minlength="2" maxlength="60" placeholder="Например, Ancient Squad"'))}${field('game','Игра',select('game',Object.keys(games),d.game))}${field('language','Язык',select('language',['Русский','English'],d.language))}${field('goal','Цель',input('goal',d.goal,'required maxlength="140"'))}${field('period','Время суток',select('period',['Утро','День','Вечер','Ночь'],d.period))}<div class="wide">${field('schedule',d.type==='team'?'Расписание':'Дата и время игры',input('schedule',d.schedule,'required maxlength="140"'))}</div>${d.type==='lobby'?`<div class="wide">${field('parent','Команда',select('parent',[['','Самостоятельное лобби'],...db.groups.filter(g=>g.type==='team'&&g.owner==='me'&&g.game===d.game).map(g=>[g.id,g.name])],d.parent))}</div>`:''}<div class="wide">${field('description',d.type==='team'?'Описание команды':'Описание лобби',textarea('description',d.description,'required minlength="5" maxlength="1500"'))}</div></div>${submit('Перейти к требованиям')}</form>`}
function requirementsView(){if(!db.plus)return createView();let d=draft();if(d.name.trim().length<2||d.description.trim().length<5)return newView();let r=ui.recruitDraft||(ui.recruitDraft={roles:[games[d.game].roles[0]],rank:'Любой',capacity:5,text:''});return title('Условия набора','new')+`<form id="recruit-form" class="content fields">${field('roles','Кого ищем?',`<div class="options">${games[d.game].roles.map(role=>`<label class="chip" style="display:flex;align-items:center;gap:7px;margin:0"><input type="checkbox" name="roles" value="${esc(role)}" ${r.roles.includes(role)?'checked':''}>${esc(role)}</label>`).join('')}</div>`)}<div class="form-grid">${field('rank','Ранг от',select('rank',['Любой',...games[d.game].ranks],r.rank))}${field('capacity','Сколько игроков ищем?',`<div class="stepper"><button type="button" data-action="seats" data-delta="-1" aria-label="На одного игрока меньше">−</button><input type="number" id="capacity" name="capacity" value="${r.capacity-1}" min="1" max="19" required><button type="button" data-action="seats" data-delta="1" aria-label="На одного игрока больше">+</button></div>`)}</div><p class="hint">Вы уже в составе. Всего участников с вами: <span id="vacancies">${r.capacity}</span>.</p>${field('text','Текст объявления',textarea('text',r.text,'required minlength="5" maxlength="1500" placeholder="Каких игроков вы ищете?"'))}<p class="error" id="recruit-error" role="alert"></p>${submit('Открыть набор')}</form>`}
function publishedView(){let g=group(route.id);if(!g||g.owner!=='me')return missing();return title('Набор открыт')+`<div class="center"><div class="symbol round">${svg('check')}</div><h2>Можно знакомиться с игроками</h2><p>${esc(g.name)} · ${esc(g.game)}<br>Заявки будут появляться в разделе «Мои команды».</p><div class="actions">${button(g.type==='team'?'Открыть мою команду':'Открыть моё лобби','go',{screen:'team',id:g.id,secondary:true})}${button('Перейти к заявкам','go',{screen:'incoming',id:g.id})}</div></div>`}
function incomingView(){let g=group(route.id);if(!g||g.owner!=='me')return missing('Управлять заявками может только организатор команды или лобби.');let as=db.applications.filter(a=>a.group===g.id).sort((a,b)=>(a.status==='pending'?-1:1)-(b.status==='pending'?-1:1)||b.created-a.created);return title('Входящие заявки','team/'+g.id)+`<p class="subtitle">${esc(g.name)} · Свободных мест: ${capacity(g)}</p><div class="grid">${as.length?as.map(a=>`<button class="card" data-action="go" data-screen="candidate" data-id="${a.id}"><h3>${esc(player(a.player)?.nick)}</h3><p class="muted">${esc(player(a.player)?.rank)} · ${esc(a.role)} · ${player(a.player)?.hours||0} часов</p>${badge(a.status)}</button>`).join(''):'<div class="empty-inline">Пока никто не откликнулся. Набор открыт — новые заявки появятся здесь.</div>'}</div>`}
function candidateView(){let a=db.applications.find(a=>a.id===route.id),g=a&&group(a.group),p=a&&player(a.player);if(!a||!g||g.owner!=='me'||!p)return missing();return title('Заявка от '+p.nick,'incoming/'+g.id)+`<div class="narrow"><div class="card"><div class="person">${avatar(p.id)}<h2>${esc(p.nick)}</h2></div><p class="muted">${esc(g.game)} · ${esc(p.rank)} · ${esc(a.role)}</p><p class="muted">Язык: русский · Время: с 20:00</p><p>${esc(a.text)}</p>${badge(a.status)}</div><div class="actions">${button('Написать','dm',{id:p.id,secondary:true})}${a.status==='pending'?button('Отклонить заявку','decide',{id:a.id,status:'rejected',secondary:true})+button(capacity(g)?'Принять в '+(g.type==='team'?'команду':'лобби'):'Состав собран','decide',{id:a.id,status:'accepted',disabled:!capacity(g)}):''}</div></div>`}
function messagesView(){let chats=db.chats.filter(hasChatAccess).filter(c=>ui.messageType==='all'||(ui.messageType==='personal'?!c.group:!!c.group)).sort((a,b)=>(b.messages.at(-1)?.created||0)-(a.messages.at(-1)?.created||0));return title('Сообщения')+tabs([['all','Все'],['personal','Личные'],['group','Команды и лобби']],ui.messageType,'message-tab')+`<div class="grid">${chats.length?chats.map(c=>{let m=c.messages.at(-1);return `<button class="card" data-action="go" data-screen="chat" data-id="${c.id}"><h3>${esc(chatName(c))}${c.group?' · чат '+(group(c.group).type==='team'?'команды':'лобби'):''}</h3><p class="muted">${m?esc((m.author==='me'?'Вы':player(m.author)?.nick)+': '+m.text.slice(0,85)):'Начните общение'}</p></button>`}).join(''):'<p class="empty-inline">В этой категории пока нет переписок.</p>'}</div>`}
function chatView(){let c=db.chats.find(c=>c.id===route.id);if(!hasChatAccess(c))return missing('Чат доступен только участникам команды или лобби.');return title(chatName(c),'messages')+`<div class="chat"><button class="callbar" data-action="start-call" data-id="${c.id}">${svg('phone')} Голосовой звонок</button><div class="chatlog" id="chatlog" role="log" aria-label="Сообщения" aria-live="polite">${c.messages.length?c.messages.map(m=>`<div class="bubble ${m.author==='me'?'mine':''}"><small>${esc(m.author==='me'?'Вы':player(m.author)?.nick)} · ${dateTime(m.created)}</small>${esc(m.text)}</div>`).join(''):'<p class="muted">Напишите первое сообщение.</p>'}</div><form id="message-form" class="composer"><label for="message" class="sr-only">Сообщение</label><textarea name="message" id="message" placeholder="Сообщение…" rows="1" maxlength="2000" required></textarea><button type="submit" aria-label="Отправить сообщение">${svg('send')}</button></form><p class="hint" style="margin-top:8px">Enter — отправить, Shift + Enter — новая строка.</p></div>`}
function callView(){let c=db.chats.find(c=>c.id===route.id);if(!hasChatAccess(c))return missing();let ids=c.group?group(c.group).members:['me',c.peer];return title('Голосовой звонок','chat/'+c.id)+`<div class="narrow"><p class="hint spacer">Демонстрация голосового чата. Микрофон не включается, аудио не передаётся.</p><div class="callgrid"><h3 style="grid-column:1/-1;text-align:center">${esc(chatName(c))}</h3>${ids.map(id=>`<div class="card"><b>${esc(initials(player(id)?.nick))}</b><p class="muted">${esc(player(id)?.nick)}${id==='me'?' · Вы':''}</p></div>`).join('')}</div><p class="timer" id="timer">00:00</p><div class="actions">${button('Завершить демозвонок','end-call',{id:c.id,secondary:true})}</div></div>`}
function profileView(){return title('Мой профиль')+`<div class="narrow list"><div class="card profilehero"><span class="avatar">${esc(initials(db.user.nick))}</span><div><strong>${esc(db.user.nick)}</strong><small>${esc(db.user.profiles[0]?.game||'Добавьте игру')} · ${esc(db.user.profiles[0]?.rank||'Ранг не указан')}</small></div></div>${[['Игровые профили','games'],['Предпочтения','preferences'],['Подписка','subscription'],['Настройки','settings']].map(([t,s])=>`<button class="card menu" data-action="go" data-screen="${s}">${t}${s==='subscription'?`<small>${db.plus?'PLUS':'FREE'}</small>`:svg('next')}</button>`).join('')}</div>`}
function subscriptionView(){return title('Тарифы WithTeam','profile')+`<div class="content"><p class="subtitle">Найдите своих игроков бесплатно. Plus пригодится, когда захотите собрать собственный состав.</p><div class="split"><section class="card pricing"><b>Базовый</b><h2>0 ₽ <small>/ без ограничения срока</small></h2><ul><li>Поиск команд и лобби</li><li>Заявки на вступление</li><li>Участие в составе и переписка</li></ul><p class="hint">Подходит, если вы хотите присоединиться к другим игрокам.</p></section><section class="card pricing"><b class="note">WithTeam Plus</b><h2>199 ₽ <small>/ 30 дней</small></h2><ul><li>Все возможности базового тарифа</li><li>Создание команд и лобби</li><li>Открытие набора и разбор заявок</li></ul><p class="hint">Предлагаемая цена учебного проекта.</p></section></div><section class="card section"><h2>Как работает подписка</h2><p>Предлагаемые условия: 30 дней доступа, без автоматического продления. После окончания срока составы и переписка сохраняются; создание новых команд, лобби и открытие набора снова доступны после продления.</p><p class="hint">В этом прототипе нет оплаты. Кнопка ниже включает возможности Plus только для знакомства с сервисом.</p></section><div class="actions">${db.plus?button('Создать команду или лобби','go',{screen:'new'}):button('Попробовать возможности Plus','activate-plus')}${db.plus?'<p class="hint">Демонстрационный доступ Plus включён.</p>':''}</div></div>`}

function settingsView(){return title('Настройки','profile')+`<div class="narrow list">${[['Уведомления','notifications'],['Приватность','privacy'],['Часовой пояс','timezone'],['Изменить профиль','edit']].map(([t,s])=>`<button class="card menu" data-action="go" data-screen="${s}">${t}${svg('next')}</button>`).join('')}</div>`}
function settingsFormView(){let s=route.screen,u=db.user;let names={edit:'Изменить профиль',preferences:'Предпочтения',games:'Игровые профили',timezone:'Часовой пояс',notifications:'Уведомления',privacy:'Приватность'};let body='';let check=(name,text)=>`<label class="checkrow">${text}<input type="checkbox" name="${name}" ${db.settings[name]?'checked':''}></label>`;
if(s==='edit')body=field('nick','Ник',input('nick',u.nick,'required minlength="2" maxlength="32" autocomplete="nickname"'))+field('about','О себе',textarea('about',u.about,'maxlength="1000"'));
if(s==='preferences')body=field('language','Язык общения',select('language',['Русский','English'],u.language))+field('schedule','Время игры',input('schedule',u.schedule,'required maxlength="140"'))+field('goal','Игровые цели',input('goal',u.goal,'required maxlength="140"'));
if(s==='games'){let game=ui.profileGame||u.profiles[0]?.game||'Dota 2',p=u.profiles.find(p=>p.game===game)||{game,rank:games[game].ranks[0],role:games[game].roles[0]};body='<p class="hint">Выберите игру, укажите ранг и роль. Для каждой игры сохраняется отдельный профиль.</p>'+u.profiles.map(p=>'<div class="card"><h3>'+esc(p.game)+'</h3><p class="muted">'+esc(p.rank)+' · '+esc(p.role)+'</p></div>').join('')+field('game','Игра',select('game',Object.keys(games),p.game))+field('rank','Ранг',select('rank',games[p.game].ranks,p.rank))+field('role','Роль',select('role',games[p.game].roles,p.role));}
if(s==='timezone')body=field('timezone','Часовой пояс',select('timezone',[['Europe/Kaliningrad','Калининград (UTC+2)'],['Europe/Moscow','Москва (UTC+3)'],['Asia/Yekaterinburg','Екатеринбург (UTC+5)'],['Asia/Novosibirsk','Новосибирск (UTC+7)'],['Asia/Vladivostok','Владивосток (UTC+10)']],u.timezone))+'<p class="hint">Часовой пояс используется для времени сообщений и заявок.</p>';
if(s==='notifications')body=check('applications','Обновления по заявкам')+check('messages','Новые сообщения')+'<p class="hint">Настройки сохранены для демонстрации. Системные уведомления не отправляются.</p>';
if(s==='privacy')body=check('visible','Показывать игровой профиль')+check('allowDM','Разрешить личные сообщения')+'<p class="hint">Параметры сохраняются в этом браузере. В демоверсии нет подключения к другим пользователям.</p>';
return title(names[s],['preferences','games'].includes(s)?'profile':'settings')+`<form id="settings-form" class="narrow fields">${body}${submit('Сохранить')}</form>`}
const views={search:searchView,filters:filtersView,team:teamView,player:playerView,apply:applyView,application:applicationView,groups:groupsView,applications:applicationsView,create:createView,new:newView,requirements:requirementsView,published:publishedView,incoming:incomingView,candidate:candidateView,messages:messagesView,chat:chatView,call:callView,profile:profileView,subscription:subscriptionView,settings:settingsView,edit:settingsFormView,preferences:settingsFormView,games:settingsFormView,timezone:settingsFormView,notifications:settingsFormView,privacy:settingsFormView};
function render(){app.classList.toggle('chat-screen',route.screen==='chat');let navSection=['groups','applications','create','new','requirements','published','incoming','candidate'].includes(route.screen)?'groups':['messages','chat','call'].includes(route.screen)?'messages':['profile','subscription','settings','edit','preferences','games','timezone','notifications','privacy'].includes(route.screen)?'profile':'search';nav.innerHTML=`<button class="brand" data-action="go" data-screen="search" aria-label="WithTeam — Поиск">WithTeam</button>`+[['search','Поиск'],['groups','Мои команды'],['messages','Сообщения'],['profile','Профиль']].map(([s,t])=>`<button class="nav-item" data-action="go" data-screen="${s}" ${navSection===s?'aria-current="page"':''}>${svg(s)}<span>${t}</span></button>`).join('');app.innerHTML=(views[route.screen]||(()=>missing()))();document.title='WithTeam — '+(app.querySelector('h1')?.textContent||'Поиск');if(route.screen==='chat'){let log=document.getElementById('chatlog');if(log)log.scrollTop=log.scrollHeight}if(lastRoute!==location.hash){window.scrollTo({top:0,behavior:'instant'});app.querySelector('h1')?.focus({preventScroll:true});lastRoute=location.hash}updateTimer()}
function readRoute(){let [screen,id='']=(location.hash.slice(1)||'search').split('/');if(screen==='app'){document.getElementById('app').focus();return}try{id=decodeURIComponent(id)}catch{id=''}route={screen:views[screen]?screen:'notfound',id};if(route.screen!=='call')ui.call=null;render()}
function captureNew(form){let v=Object.fromEntries(new FormData(form)),previous=draft();if(v.game!==previous.game){ui.recruitDraft=null;v.parent=''}ui.newDraft={...previous,...v};return ui.newDraft}
function ensureGroupChat(g){let c=db.chats.find(c=>c.group===g.id);if(!c){c={id:newId('chat'),group:g.id,messages:[]};db.chats.push(c);persist()}return c}
function decide(id,status){let a=db.applications.find(a=>a.id===id),g=a&&group(a.group);if(!a||!g||g.owner!=='me'||a.status!=='pending')return toast('Эта заявка уже обработана.');if(status==='accepted'){if(!capacity(g))return toast('Состав уже собран. Нового игрока пока добавить нельзя.');if(!g.members.includes(a.player))g.members.push(a.player);if(capacity(g)>0&&g.roles.length>1)g.roles=g.roles.filter(role=>role!==a.role);if(!capacity(g))g.active=false;ensureGroupChat(g)}a.status=status;a.decided=Date.now();persist();go('incoming',g.id);toast(status==='accepted'?'Игрок принят в состав':'В этот раз не подошло')}
document.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(!b||b.disabled)return;let {action,screen,id,value,field:filterField,status}=b.dataset;
if(action==='application-filter'){ui.applicationFilter=value;render();return}if(action==='back'){if(history.state?.withteam)history.back();else go(screen,id);return}if(action==='seats'){let input=document.getElementById('capacity');input.value=Math.min(19,Math.max(1,Number(input.value)+Number(b.dataset.delta)));input.dispatchEvent(new Event('input',{bubbles:true}));return}if(action==='go'){if(screen==='games')ui.profileGame=null;if(screen==='player'&&group(route.id))ui.playerGame=group(route.id).game;if(route.screen==='new'){let f=document.getElementById('new-form');if(f)captureNew(f)}go(screen,id);}
if(action==='search-tab'){ui.searchType=value;render()}
if(action==='group-tab'){if(value==='applications')go('applications');else{ui.groupType=value;render()}}
if(action==='message-tab'){ui.messageType=value;render()}
if(action==='filters'){ui.draftFilters={...ui.filters,type:ui.searchType==='team'?'Команда':'Лобби'};go('filters')}
if(action==='filter-choice'){let f=ui.draftFilters;f[filterField]=value;if(filterField==='game'){f.role='Любая';f.rank='Любой'}let scroll=window.scrollY;render();window.scrollTo({top:scroll,behavior:'instant'});app.querySelector(`[data-field="${filterField}"][aria-pressed="true"]`)?.focus({preventScroll:true})}
if(action==='reset-filters'){ui.filters={game:'Dota 2',role:'Любая',rank:'Любой',language:'Любой',period:'Любое'};render()}
if(action==='clear-filter-draft'){ui.draftFilters={game:'Dota 2',role:'Любая',rank:'Любой',language:'Любой',period:'Любое',type:'Команда'};render()}
if(action==='create-group')go(db.plus?'new':'create');
if(action==='activate-plus'){db.plus=true;persist();go('new');toast('Plus включён для демонстрации. Оплаты нет.')}
if(action==='withdraw'){let a=db.applications.find(a=>a.id===id&&a.player==='me');if(a?.status==='pending'){a.status='withdrawn';persist();render();toast('Заявка отозвана')}}
if(action==='open-group-chat'){let g=group(id);if(g?.members.includes('me'))go('chat',ensureGroupChat(g).id)}
if(action==='dm'){if(id==='me')return go('profile');if(!player(id))return;let c=db.chats.find(c=>c.peer===id);if(!c){c={id:newId('dm'),peer:id,messages:[]};db.chats.push(c);persist()}go('chat',c.id)}
if(action==='decide')decide(id,status);
if(action==='start-call'){ui.call={id,started:Date.now()};go('call',id)}
if(action==='end-call'){ui.call=null;go('chat',id)}
});
document.addEventListener('input',e=>{let f=e.target.closest('form');if(!f)return;if(f.id==='apply-form'){ui.applicationDraft[f.dataset.group]=Object.fromEntries(new FormData(f))}if(f.id==='new-form')captureNew(f);if(f.id==='recruit-form'){ui.recruitDraft={roles:new FormData(f).getAll('roles'),rank:f.elements.rank.value,capacity:Number(f.elements.capacity.value)+1,text:f.elements.text.value};let n=document.getElementById('vacancies');if(n)n.textContent=Number(f.elements.capacity.value)+1}});
document.addEventListener('change',e=>{let f=e.target.closest('form');if(!f)return;if(f.id==='new-form'){let old=ui.newDraft?.game;captureNew(f);if(e.target.name==='game'&&old!==e.target.value){ui.recruitDraft=null;ui.newDraft.parent=''}if(['type','game'].includes(e.target.name))render()}if(f.id==='settings-form'&&route.screen==='games'&&e.target.name==='game'){ui.profileGame=e.target.value;let g=games[e.target.value],p=db.user.profiles.find(p=>p.game===e.target.value);f.elements.rank.innerHTML=g.ranks.map(v=>`<option ${v===p?.rank?'selected':''}>${esc(v)}</option>`).join('');f.elements.role.innerHTML=g.roles.map(v=>`<option ${v===p?.role?'selected':''}>${esc(v)}</option>`).join('')}});
document.addEventListener('keydown',e=>{if(e.target.id==='message'&&e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();e.target.form.requestSubmit()}});
document.addEventListener('submit',e=>{let f=e.target;if(!(f instanceof HTMLFormElement))return;e.preventDefault();let data=new FormData(f),v=Object.fromEntries(data);
if(f.id==='filters-form'){let {type,...filters}=ui.draftFilters;ui.filters=filters;ui.searchType=type==='Лобби'?'lobby':'team';go('search')}
if(f.id==='apply-form'){let g=group(f.dataset.group);if(!g||g.members.includes('me')||ownApplication(g)||!g.active||!capacity(g))return toast('Нельзя отправить заявку. Обновите страницу команды или лобби.');if(v.text.trim().length<5){f.elements.text.setCustomValidity('Напишите хотя бы 5 символов.');f.elements.text.reportValidity();f.elements.text.setCustomValidity('');return}let a={id:newId('application'),group:g.id,player:'me',role:v.role,text:v.text.trim(),status:'pending',created:Date.now()};db.applications.push(a);persist();delete ui.applicationDraft[g.id];go('application',a.id)}
if(f.id==='new-form'){captureNew(f);if(ui.newDraft.name.trim().length<2||ui.newDraft.description.trim().length<5)return toast('Заполните название и описание команды или лобби.');go('requirements')}
if(f.id==='recruit-form'){let roles=data.getAll('roles'),error=document.getElementById('recruit-error');if(!roles.length){error.textContent='Выберите хотя бы одну игровую роль.';return}if(v.text.trim().length<5){error.textContent='Добавьте описание набора: не менее 5 символов.';return}if(!db.plus)return go('subscription');let d=draft();if(d.name.trim().length<2||d.description.trim().length<5)return go('new');let g={id:newId('group'),...d,name:d.name.trim(),description:d.description.trim(),owner:'me',members:['me'],capacity:Number(v.capacity)+1,rank:v.rank,roles,active:true,recruitText:v.text.trim()};db.groups.push(g);ensureGroupChat(g);persist();ui.newDraft=null;ui.recruitDraft=null;go('published',g.id)}
if(f.id==='message-form'){let text=v.message.trim(),c=db.chats.find(c=>c.id===route.id);if(!text||!hasChatAccess(c))return;c.messages.push({author:'me',text,created:Date.now()});persist();render();document.getElementById('message')?.focus()}
if(f.id==='settings-form'){let s=route.screen;if(s==='edit'){if(v.nick.trim().length<2)return toast('Ник должен содержать не менее 2 символов.');db.user.nick=v.nick.trim();db.user.about=v.about.trim()}if(s==='preferences'){db.user.language=v.language;db.user.schedule=v.schedule.trim();db.user.goal=v.goal.trim()}if(s==='games'){let p={game:v.game,rank:v.rank,role:v.role},index=db.user.profiles.findIndex(p=>p.game===v.game);if(index<0)db.user.profiles.push(p);else db.user.profiles[index]=p;ui.profileGame=v.game;}if(s==='timezone')db.user.timezone=v.timezone;if(s==='notifications'){db.settings.applications=data.has('applications');db.settings.messages=data.has('messages')}if(s==='privacy'){db.settings.visible=data.has('visible');db.settings.allowDM=data.has('allowDM')}persist();go(['edit','preferences','games'].includes(s)?'profile':'settings');toast('Изменения сохранены')}
});
function updateTimer(){let t=document.getElementById('timer');if(!t)return;if(!ui.call||ui.call.id!==route.id)ui.call={id:route.id,started:Date.now()};let n=Math.max(0,Math.floor((Date.now()-ui.call.started)/1000));t.textContent=(Math.floor(n/60)).toString().padStart(2,'0')+':'+(n%60).toString().padStart(2,'0')}
window.addEventListener('hashchange',readRoute);window.addEventListener('popstate',readRoute);window.addEventListener('storage',e=>{if(e.key!==STORAGE)return;try{let value=JSON.parse(e.newValue);if(value?.version===2&&value.groups&&value.user){db=value;render()}}catch{}});setInterval(updateTimer,1000);readRoute();
</script>
</body>
</html>
